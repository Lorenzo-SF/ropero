# Ropero instala el release Linux y prepara el entorno Python del servidor.
# El pack del modelo se descarga por separado desde el TOML del modelo.
id = "basalt"
label = "Basalt"
description = "Basalt (Linux x86-64, NVIDIA Blackwell, API OpenAI y Anthropic)"
maturity = "integrated"
formats = ["basalt"]
port_min = 9900
port_max = 9909
deps = ["nvidia-smi", "python3"]
compat = [{ os = ["linux"], nvidia_smi = true }]

[detect]
binaries = ["basalt"]
paths = ["~/.local/share/ropero/engines/basalt/bin/basalt"]

[install.system_packages]
"apt-get" = ["python3", "python3-venv"]
pacman = ["python"]
