# Manifiesto del motor `airllm` (doc B §4.3).
#
# El servidor y la integración con el runtime de Ropero aún no están
# implementados. No debe anunciarse como probado o disponible.

id = "airllm"
label = "AirLLM"
description = "AirLLM (compresión propia 4-bit y 8-bit)"

# R-CTX-3: la integración está incompleta.
maturity = "partial"

# Los formatos que el motor acepta (doc CLI v2 §4).
formats = ["safetensors", "pytorch-bin"]

# El rango de puertos propio (doc CLI v2 §5.1).
port_min = 9930
port_max = 9939

# Los comandos externos de los que depende: es lo que chequea `ropero doctor`.
deps = ["uv"]

# Las reglas de SO y hardware. Se evalúan **todas** y se acumulan.
#
# Ojo: la tabla `[detect]` va **al final** del fichero. En TOML las tablas
# son "pegajosas": todo lo que va después de `[detect]` pertenece a
# `[detect]`, y `compat` acabaría dentro de ella.
compat = [
  { os = ["linux"] },
  { os = ["macos"] },
]

# Cómo se sabe que está instalado.
[detect]
binaries = ["airllm"]
paths = ["/usr/local/bin/airllm", "/opt/ropero/bin/airllm"]
