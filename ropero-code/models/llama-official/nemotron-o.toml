# =============================================================================
# nemotron — NVIDIA-Nemotron-3.5-Lightning-30B-A3B (MoE híbrido Mamba)
# =============================================================================

[model]
name    = "nemotron-o"
engine  = "llama-server-official"
context = 65536

[files]
gguf = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-MTP.gguf"
chat_template = "chat_template.jinja"

[download]
repo = "unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
file = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE.gguf"
name = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-MTP.gguf"
size = "18.90 GB"

[download.aux.chat_template]
repo = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
file = "chat_template.jinja"
name = "chat_template.jinja"
size = "9.87 KB"
use  = "run"

[build]
repo         = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
quant        = "NVFP4"
imatrix_repo = "bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
imatrix_file = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-imatrix.gguf"
keep_source  = true
size         = "65.8 GB"

[levels]
list        = ["instruct", "think"]
default     = "instruct"

[args]
base = [
    "--n-gpu-layers", "54",
    "--n-cpu-moe", "12",
    # "--moe-cache","soft", 
    "--kv-unified",
    "--kv-offload",
    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",

    "--repeat-penalty", "1.1",
    "--repeat-last-n", "64",
    "--n-predict", "8192",
    "--keep", "16384",
    "--chat-template-file", "${chat_template}",

    "--spec-type", "ngram-map-k4v",
    "--spec-ngram-map-k4v-size-n", "24",
    "--spec-ngram-map-k4v-size-m", "48",
    "--spec-ngram-map-k4v-min-hits", "1",
]

[args.level.think]
chat_template_kwargs = { enable_thinking = true }
base = [
    "--temp", "0.6",
    "--top-p", "0.9",
    "--min-p", "0.01",
    "--top-k", "5",
    "--reasoning", "true",
    "--reasoning-format", "deepseek",
    "--reasoning-preserve",
    "--reasoning-budget", "32768",
    "--spec-draft-n-max", "4", 

]

[args.level.instruct]
chat_template_kwargs = { enable_thinking = false }
base = [
    "--temp", "0.2",
    "--reasoning", "false",
    "--spec-draft-n-max", "3", 

]
