name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: cargo-deny
        # cargo-deny-action is a Docker action, so run it on Linux only.
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: tests
        run: cargo test --locked --workspace --all-features
      - name: nextest
        uses: taiki-e/install-action@nextest
      - name: run nextest
        run: cargo nextest run --locked --workspace --all-features
      - name: release build
        run: cargo build --locked --release -p ropero-cli
      - name: CLI smoke test
        run: ./target/release/ropero --help
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage
        # Sin umbrales todavía: los crates stubs tienen 0% de cobertura; activar
        # los umbrales de §9.4 cuando exista implementación real.
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.os }}
          path: lcov.info
          if-no-files-found: error
