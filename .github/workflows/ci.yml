name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.100.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: cargo-deny
        # cargo-deny-action is a Docker action, so run it on Linux only.
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
      - name: tests
        run: cargo test --locked --workspace --all-features
      - name: nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: nextest
      - name: run nextest
        run: cargo nextest run --locked --workspace --all-features
      - name: release build
        run: cargo build --locked --release -p ropero-cli
      - name: CLI smoke test
        run: ./target/release/ropero --help
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov
      - name: coverage
        # Sin umbrales todavía: los crates stubs tienen 0% de cobertura; activar
        # los umbrales de §9.4 cuando exista implementación real.
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - name: upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: lcov-${{ matrix.os }}
          path: lcov.info
          if-no-files-found: error
