# Ropero model catalog template (schema guide; values below are examples).
# Copy to ~/.config/ropero/models/<engine>/<name>.toml and edit it.
# `ropero models add` builds and validates a clean TOML without reading this file.
# Run `ropero validate` after manual edits. Unknown fields are discarded by
# `models add` with a warning; direct catalog files must use known fields.

# [model] identifies the model in Ropero and the engine-facing artifact.
[model]
name = "my-model"             # Must match this file name (my-model.toml).
engine = "llama-server"       # llama-server, turbo-llama, vllm, mlx-serve,
                              # airllm, tensorrt-llm, fastflowllm, strata, ignis.
format = "gguf"                # gguf, safetensors, q4nx, strata, or ninfer.
context = 32768                # Optional context length in tokens.
# alias = "engine-model-id"   # Optional ID exposed by the engine/API.
# path = "family/package"     # Main path for safetensors, q4nx, strata, ninfer.
# port = 9997                  # Optional pinned port; usually leave unset.

# [files] names the main artifact and runtime auxiliaries. GGUF files live
# under $GGUF_DIR/<name>; safetensors use [model].path.
[files]
gguf = "my-model.gguf"
# mtp = "my-model-mtp.gguf"
# mmproj = "mmproj-model.gguf"
# chat_template = "chat-template.jinja"

# [download] fetches one primary file (or a checkpoint directory).
# Auxiliary files can use this repo or another repo, independently.
[download]
repo = "owner/repository"
file = "my-model.gguf"
# name = "renamed.gguf"       # Optional local filename.
# size = "12 GB"              # Display only.
# manual = false              # true excludes automatic model installation.
# excludes = ["original/*"]  # Optional checkpoint download exclusions.

# Repeat as needed: [download.aux.mtp], .mmproj, .chat_template, .imatrix,
# or .tokenizer. Each entry accepts file (required), repo, name, size, and
# use = "run" or "build". An omitted repo inherits [download].repo.
# [download.aux.mtp]
# file = "mtp.gguf"
# repo = "another-owner/another-repository"
# use = "run"

# [build] describes conversion/quantization. It may coexist with download;
# `ropero install models` then asks which route to use.
# repo = "owner/source-weights"
# gguf = true
# gguf_file = "source-f16.gguf"
# quant = "q4_k_m"            # Or a list of quantization names.
# imatrix = "importance.dat"
# imatrix_repo = "owner/imatrix-repo"
# imatrix_file = "importance.dat"
# out = "$GGUF_DIR/my-model/final.gguf"
# out_principal = "final.gguf"
# from_subdir = false
# include = ["*.safetensors"]
# intermedio = "f16"          # f16 or bf16.
# keep_source = false
# keep_intermedio = false
# no_mtp = false
# force = false
# size = "12 GB"              # Display only.

# [levels] defines the accepted reasoning levels. [flags] defines switches;
# [options] defines valued options. Undeclared run-time selections are ignored.
# [levels]
# list = ["low", "high"]
# default = "low"
# [flags]
# list = ["flash-attn"]
# [options]
# list = ["temperature", "top-p"]
# [options.default]
# temperature = "0.7"
# top-p = "0.9"
# [aliases]
# think = "high"             # Alias for one level in [levels].list.

# [limits] contains optional preflight resource requirements.
# [limits]
# min_ram_gb = 32.0
# min_ram_note = "32 GB recommended"

# [args].base is the model's common engine arguments. It is empty here so
# copying the template does not silently add engine flags.
[args]
base = []

# Additional arguments are appended to the common list:
# [args.level.high]
# base = ["--reasoning-budget", "16384"]
# chat_template_kwargs = { enable_thinking = true }
# [args.flag.flash-attn]
# base = ["--flash-attn"]
# requires = ["mtp"]         # Keys from [files].
# [args.option.temperature]
# base = ["--temp", "${value}"]
# replace = "--temp"         # Replace the common flag/value pair.

# Available placeholders in argument arrays: ${gguf}, ${mtp}, ${mmproj},
# ${chat_template}, ${ctx}, ${value}, ${gguf_dir}, ${safetensors_dir},
# ${artifacts_dir}, ${model_path}, ${env:NAME}, ${env:NAME:-default}.
# Mount order: args.base, selected level, selected flags, then options.
