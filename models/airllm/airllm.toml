# =============================================================================
# airllm — gpt-oss-120b con AirLLM
# =============================================================================
#
# Este modelo está basado en el safetensors gpt-oss-120b y se ejecuta con
# AirLLM. La ruta del checkpoint es relativa a $SAFETENSORS_DIR.
#
#   MODEL_ENGINE="airllm"  → ropero usa el flujo específico de AirLLM en lugar
#   del de llama-server.
#
# ⚠️ RENDIMIENTO EN macOS:
#   - En Apple Silicon, AirLLM puede usar MPS (Metal Performance Shaders)
#     automáticamente.
#   - Un modelo de 120B requiere mínimo 30-40 GB de RAM (cuantizado 4-bit) o más.
#   - Asegúrate de que $SAFETENSORS_DIR/gpt-oss-120b exista antes de arrancar.
#   - Recomendado: usar --ctx-size ajustado a tu memoria disponible.
#
# La descarga NO la hace `ropero --install models`: son ~130-240 GB según la
# variante, no es una descarga que un install pueda hacer por sorpresa. El
# exclude "original/*" importa: el repo trae los pesos bf16 SIN cuantizar junto
# a la versión cuantizada, y sin excluirlo descargas los dos juegos (el doble
# de disco para nada).
# =============================================================================

[model]
name    = "airllm"
engine  = "airllm"
context = 131072
format  = "safetensors"
path    = "gpt-oss-120b"

[files]
# Este engine carga un checkpoint safetensors, no un GGUF: [files].gguf se
# queda vacío a propósito.

[download]
repo     = "openai/gpt-oss-120b"
file     = "gpt-oss-120b"
size     = "130 GB"
excludes = ["original/*"]
# manual: el modelo existe y se puede arrancar, pero su descarga NO se ofrece
# en `ropero install models`. Son 130 GB de checkpoint: eso no es una descarga
# que un install pueda hacer por sorpresa, ni una que quepa en un plan de
# "descarga lo que falte". Si lo quieres, se pide a mano:
#
#     hf download openai/gpt-oss-120b --local-dir $SAFETENSORS_DIR/gpt-oss-120b \
#         --exclude "original/*"
manual   = true

# ── Flags del servidor de AirLLM ────────────────────────────────────────────
# Para un engine con servidor propio, [args].base son los flags de SU
# servidor (aquí, airllm_server), no flags de llama-server. Es la misma
# tabla que usa un modelo llama-server, con el mismo significado.
[args]
base = [
    "--compression", "4bit",
    "--max-new-tokens", "4096",
    "--layer-shards", "${env:ROPERO_AIRLLM_SHARDS:-$HOME/models/airllm-shards}",
]
