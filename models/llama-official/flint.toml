# =============================================================================
# flint — Recursive Flint (MoE, 39.8 B params, NVFP4)
# =============================================================================

[model]
name    = "flint-o"
engine  = "llama-server-official"
context = 262144

[files]
gguf = "flint-nvfp4.gguf"

[download]
repo = "RecursiveSI/flint-nvfp4-gguf"
file = "flint-nvfp4.gguf"
size = "22.86 GB"

[args]
base = [
    "--n-gpu-layers", "26",
    "--n-cpu-moe", "14",

    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",

    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",

    "--n-predict", "8192",
    "--keep", "16384",
]
