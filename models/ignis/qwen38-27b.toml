[model]
name = "qwen38-27b"
engine = "ignis"
format = "ninfer"
context = 262144

[files]

[download]
# Identificador del catálogo interno de Ignis; `ropero install models` lo
# pasa a `ignis-server model download`, que también obtiene los companions.
repo = "qwen3.8-27b"
size = "según perfil de GPU"

[args]
base = [
  "--model-id", "qwen3.8-27b",
  "--profile", "rtx-16gb",
  "--download-path", "${artifacts_dir}",
  "--download-enabled", "false",
  "--model-max-context", "${ctx}",
  "--spec-backend", "dflash2",
  "--spec-draft-tokens", "7",
  "--model-thinking-budget", "8192",
]
