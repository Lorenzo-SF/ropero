# =============================================================================
# nemotron — NVIDIA-Nemotron-3.5-Lightning-30B-A3B (MoE híbrido Mamba)
# =============================================================================

[model]
name    = "nemotron"
engine  = "llama-server"
# context = 5242887
context = 266144
# context = 131072

[files]
gguf = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-F16.gguf"

[download]
repo = "unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
file = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-F16.gguf"
size = "19.76 GB"

[levels]
list = ["think"]

[flags]
list = ["mtp"]

[args]
base = [
    "--n-gpu-layers", "54",                            
    "--n-cpu-moe", "15",   
    "--cache-type-k", "turbo3",                          
    "--cache-type-v", "turbo3",
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "0",                                    
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",                         
    "--repeat-last-n", "64",
    "--n-predict", "8192",                             
    "--keep", "1024",

]

[args.level.think]
base = ["--chat-template-kwargs", '{"enable_thinking": true}']

[args.flag.mtp]
base = [
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "3",
    "--spec-draft-type-k", "turbo3",
    "--spec-draft-type-v", "turbo3"
]

