# =============================================================================
# nemotron — NVIDIA-Nemotron-3.5-Lightning-30B-A3B (MoE híbrido Mamba)
# =============================================================================

[model]
name    = "nemotron"
engine  = "llama-server"
# context = 5242887
context = 266144
# context = 131072

[files]
# El nombre local del GGUF. OJO: el sufijo "-MTP" es historico: este
# fichero NO lleva la MTP dentro (52 bloques, nextn=0). La MTP va SUELTA, en
# su propio GGUF, como modelo de draft (ver [download.aux.mtp]).
gguf = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE-MTP.gguf"

[download]
# OJO: el fichero "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE-MTP.gguf"
# NO EXISTE en ningun repo (HTTP 404). En el repo de unsloth el MXFP4 se
# llama sin el sufijo, y ESE lleva la MTP DENTRO (53 bloques).
#
# Este es el de vcruz305: 401 tensores, 52 bloques, nextn=0, file_type 38
# (MOSTLY_MXFP4_MOE). Es el que carga:
#   "done_getting_tensors: wrong number of tensors; expected 417, got 408"
# es el sintoma de un GGUF con la MTP EMBEBIDA en un motor que no la lee
# (el atomic no lee la metadata "nextn_predict_layers": cuenta 53 capas,
# crea 52 y se quedan 9 tensores del bloque 52 sin usar).
#
# Si el MXFP4 con la MTP embebida (el de unsloth) es lo que tienes en disco,
# con el atomic NO ARRANCA. Con el upstream (que si lee la metadata) si.
repo = "vcruz305/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
file = "Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE.gguf"
size = "17.98 GB"

[download.aux.mtp]
# El modelo de DRAFT de la MTP, en su propio GGUF (20 tensores, 1.99 GB).
# Es la unica MTP que existe suelta; la que va embebida en el GGUF del
# modelo no la entiende el atomic.
#
# Se baja en la carpeta del modelo, y el flag "mtp" la apunta con
# "{{model_dir}}" (el launcher sustituye ese marcador por la ruta real de
# la carpeta del modelo: no se puede poner una ruta absoluta en el TOML,
# porque depende de donde este el GGUF_DIR).
repo = "tngtech/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-GGUF"
file = "mtp-Nemotron-3.5-Lightning-30B-A3B-NVFP4.gguf"
name = "mtp-Nemotron-3.5-Lightning-30B-A3B-NVFP4.gguf"
size = "1.99 GB"

[build]
# ── CÓMO SE FABRICA ─────────────────────────────────────────────────────────
#
# Este GGUF no se descarga: se FABRICA. La seccion [build] es la receta, y
# sus claves son las mismas que acepta "ropero gguffer". El que la ejecuta
# es el gguffer de verdad, asi que "ropero install models nemotron" y el
# comando de abajo hacen EXACTAMENTE lo mismo.
#
#   ropero gguffer --repo nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16 \
#       --quant "NVFP4" \
#       --imatrix-repo bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF \
#       --imatrix-file NVIDIA-Nemotron-3.5-Lightning-30B-A3B-imatrix.gguf \
#       --out "$HOME/models/gguf/nemotron/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4.gguf" \
#       --keep-source
#
# LOS PESOS VIENEN DEL BF16, NO DEL NVFP4: el repo "...-NVFP4" ya viene
# cuantizado (trae hf_quant_config.json), y cuantizar encima de eso el motor
# lo rechaza:
#     llama_model_quantize: failed to quantize:
#     requantizing from type nvfp4 is disabled
# El gguffer lo comprueba ANTES de bajar los 65 GB y avisa.
#
# EL CHAT TEMPLATE: NVIDIA lo publica en "chat_template.jinja", NO dentro del
# tokenizer_config.json, y el conversor de llama.cpp solo mira el
# tokenizer_config.json (nunca el .jinja). Sin ese arreglo, el GGUF se queda
# con el template de la comunidad de llama.cpp, que para esta familia es el
# del Nemotron 3 NANO: con ese template el modelo responde en HTML y no
# razona bien. El gguffer lo arregla solo (mete el .jinja en el
# tokenizer_config.json antes de convertir), asi que aqui NO hace falta
# ningun --chat-template-file.
#
# EL QUANT NVFP4 NECESITA EL PARCHE DEL MOTOR: el motor tiene una regla para
# el MXFP4_MOE (los expertos a FP4 y el resto a Q8_0) y NO la tiene para el
# NVFP4. Sin ella, la atencion, las proyecciones del Mamba (ssm_in/ssm_out)
# y el embedding salen tambien a 4 bits, el estado recurrente se
# desincroniza y el modelo "habla cosas raras" (que es justo lo que pasa con
# el NVFP4 fabricado sin el parche). El parche esta en
# "parche-motor-nvfp4-y-pattern.patch" (ropero/output): la rama nueva del
# cuantizador pone F16 en todo lo que no son tensores de expertos.
#
# LA MTP: el GGUF fabricado sale con 52 bloques y nextn_predict_layers=0
# (esta arch, nemotron_h_moe, no tiene export de MTP: los 270 tensores
# "mtp.*" del checkpoint BF16 se quedan fuera). Con la MTP suelta de
# [download.aux.mtp] se usa igual.
repo         = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
quant        = "NVFP4"
imatrix_repo = "bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
imatrix_file = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-imatrix.gguf"
keep_source  = true
# Los pesos que se bajan al fabricar (tamano medido del repo de HF).
size = "65.8 GB"

[levels]
list = ["think"]

[flags]
list = ["mtp"]

[args]
base = [
    "--chat-template-kwargs", '{"enable_thinking": false}',  # OFF por defecto
    "--n-gpu-layers", "54",
    "--n-cpu-moe", "15",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "0",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--repeat-last-n", "64",
    "--n-predict", "8192",
    "--keep", "1024",

]

[args.level.think]
base = ["--chat-template-kwargs", '{"enable_thinking": true}']

[args.flag.mtp]
# La MTP de este modelo va SUELTA (fichero aparte, el de [download.aux.mtp]),
# no embebida: el atomic no lee la metadata "nextn_predict_layers" y con la
# MTP dentro el GGUF no carga. Sin --model-draft, el server aborta con
#     "context type MTP requested but model doesn't contain MTP layers"
# "{{model_dir}}" lo sustituye el launcher por la carpeta del modelo.
base = [
    "--spec-type", "draft-mtp",
    "--model-draft", "{{model_dir}}/mtp-Nemotron-3.5-Lightning-30B-A3B-NVFP4.gguf",
    "--spec-draft-n-max", "3",
    "--spec-draft-type-k", "turbo3",
    "--spec-draft-type-v", "turbo3"
]
