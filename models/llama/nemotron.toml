# =============================================================================
# nemotron — NVIDIA-Nemotron-3.5-Lightning-30B-A3B (MoE híbrido Mamba)
# =============================================================================

[model]
name    = "nemotron"
engine  = "llama-server"
context = 524288

[files]
gguf = "Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE.gguf"

# ── CÓMO SE FABRICA ─────────────────────────────────────────────────────────
#
# Este GGUF no se descarga: se FABRICA. La seccion [build] es la receta, y
# sus claves son las mismas que acepta "ropero gguffer". El que la ejecuta
# es el gguffer de verdad, asi que "ropero install models nemotron" y el
# comando de abajo hacen EXACTAMENTE lo mismo.
#
#   ropero gguffer --repo nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16 \
#       --quant MXFP4_MOE \
#       --imatrix-repo bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF \
#       --imatrix-file NVIDIA-Nemotron-3.5-Lightning-30B-A3B-imatrix.gguf \
#       --keep-source
#
# LOS PESOS VIENEN DEL BF16, NO DEL NVFP4: el repo "...-NVFP4" ya viene
# cuantizado (trae hf_quant_config.json), y cuantizar encima de eso el
# motor lo rechaza:
#     llama_model_quantize: failed to quantize:
#     requantizing from type nvfp4 is disabled
# El gguffer lo comprueba ANTES de bajar los 65 GB y avisa.
#
# EL GGUF VA SIN LA CABEZA MTP (52 bloques, nextn_predict_layers=0). El
# checkpoint BF16 trae 270 tensores "mtp.*", pero el conversor de esta
# arquitectura los deja fuera (no tiene export de MTP). Un GGUF con la MTP
# EMBEBIDA (53 bloques) NO CARGA con este motor:
#     done_getting_tensors: wrong number of tensors; expected 417, got 408
# (el atomic no lee la metadata "nextn_predict_layers", asi que cuenta 53
# capas y se queda sin usar 9 tensores del bloque 52).
[build]
repo         = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
quant        = "MXFP4_MOE"
imatrix_repo = "bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
imatrix_file = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-imatrix.gguf"
keep_source  = true
# Los pesos que se bajan al fabricar (tamano medido del repo de HF).
size = "65.8 GB"

[download]
repo = "vcruz305/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
file = "Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE.gguf"
# OJO: este "size" es el del GGUF YA HECHO que hay en el repo (17.98 GB, medido
# por HTTP), NO el de los pesos que se bajan al fabricar (65.8 GB de BF16).
# Los pesos los baja el gguffer; este repo es la alternativa publicada, que se
# puede bajar en 5 minutos en vez de fabricar en una hora.
size = "17.98 GB"

[levels]
# El nemotron tambien razona por DEFECTO (su template: "enable_thinking if
# enable_thinking is defined else True"). Por defecto va APAGADO, y se
# enciende con "ropero nemotron --think".
#
# Sin "default" a proposito: sin nivel, el [args].base manda.
list = ["think"]

[args]
base = [
    "--n-gpu-layers", "53",                            # todos los layers GPU-eligible
    "--n-cpu-moe", "${env:ROPERO_NEMOTRON_N_CPU_MOE:-12}",   # experts de las 12 primeras capas a la CPU

    # ---- Atención ----
    # -fa on lo pone ropero entry globalmente
    # NO --swa-full (Nemotron usa Mamba SSM, no SWA)
	#"--fit off",
    # ---- KV cache ----
    "--cache-type-k", "turbo3",                          # agresivo (mamba SSM no usa esto, attn sí)
    "--cache-type-v", "turbo3",
    "--cache-prompt",
    "--context-shift",

    # ---- Modelo / carga ----
    "--jinja",                                         # chat template NVIDIA Nemotron
    "--reasoning-format", "deepseek",                  # limpia tags <think> del output
    "--chat-template-kwargs", '{"enable_thinking": false}',  # OFF por defecto
    "--load-mode", "none",

    # ---- Sampling (canónico NVIDIA) ----
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "0",                                    # desactivado (solo top-p)
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",                         # sin penalty
    "--repeat-last-n", "64",

    # ---- Batching / threads ----
    "--batch-size", "2048",                            # bajado de 4096 (libera compute buffers)
    "--ubatch-size", "512",                            # bajado de 1024
    "--parallel", "1",

    # ---- Generación ----
    "--n-predict", "8192",                             # reasoning puede requerir más
    "--keep", "1024",

    # ---- Misc ----
    # --log-verbosity lo pone ropero entry (default 4)
]

# El thinking, a pedido: "ropero nemotron --think".
#
# El base lleva "enable_thinking": false y este nivel lleva true. Los dos
# van en el argv (base, luego nivel) y el ultimo gana: el server se queda
# con la kwargs del nivel.
[args.level.think]
base = ["--chat-template-kwargs", '{"enable_thinking": true}']
