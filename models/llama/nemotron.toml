# =============================================================================
# nemotron — NVIDIA-Nemotron-3.5-Lightning-30B-A3B (MoE híbrido Mamba)
# =============================================================================

[model]
name    = "nemotron"
engine  = "llama-server"
# context = 5242887
context = 266144
# context = 131072

[files]
gguf = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE-MTP.gguf"

[download]
repo = "unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
file = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE-MTP.gguf"
size = "19.76 GB"

[build]
repo         = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
quant        = "NVFP4"
imatrix_repo = "bartowski/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
imatrix_file = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-imatrix.gguf"
keep_source  = true
size = "65.8 GB"

[levels]
list = ["think"]

[flags]
list = ["mtp"]

[args]
base = [
    "--chat-template-kwargs", '{"enable_thinking": false}',  # OFF por defecto
    "--n-gpu-layers", "54",
    "--n-cpu-moe", "15",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "0",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--repeat-last-n", "64",
    "--n-predict", "8192",
    "--keep", "1024",

]

[args.level.think]
base = ["--chat-template-kwargs", '{"enable_thinking": true}']

[args.flag.mtp]
# OJO: este GGUF NO trae la cabeza MTP (52 bloques, nextn=0), y esta arch
# (nemotron_h_moe) no la lee aunque el GGUF la trajera. Con "--flag mtp" el
# server pide un contexto MTP y aborta:
#     "context type MTP requested but model doesn't contain MTP layers"
# La MTP de este modelo va aparte (el fichero "mtp-*.gguf" de tngtech), como
# modelo de draft, no embebida.
base = [
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "3",
    "--spec-draft-type-k", "turbo3",
    "--spec-draft-type-v", "turbo3"
]
