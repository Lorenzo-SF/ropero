# =============================================================================
# 🔥 FIRED — qwencoder (Qwen3-Coder-30B-A3B-Instruct UD-Q4_K_XL)
# =============================================================================
#

[model]
name    = "qwencoder"
engine  = "llama-server"
context = 131072
alias   = "coder"

[files]
gguf = "Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf"

[download]
repo = "unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF"
file = "Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf"
size = "17.7 GB"

[args]
base = [
    # ---- GPU offload (MoE 30B/3B activo) ----
    "--n-gpu-layers", "-1",                            # todos los layers GPU-eligible
    "--n-cpu-moe", "20",  # expertos MoE en CPU
    "--moe-cache","soft", # aqui, auto sube alrededor de un 10%

    "--cache-type-k", "q8_0",                          # q8_0 recomendado para tool use
    "--cache-type-v", "q8_0",
    "--reasoning-format", "deepseek",                  # limpia tags <think> (no genera, pero por si)

    # ---- Sampling (canónico Qwen3 coder) ----
    "--temp", "0.7",
    "--top-p", "0.8",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.05",
    "--repeat-last-n", "64",

    "--n-predict", "8192",                             # agentic puede requerir outputs largos
    "--keep", "1024",

]
