# =============================================================================
# 🔥 FIRED — nemotron (NVIDIA-Nemotron-3.5-Lightning-30B-A3B)
# =============================================================================
#
# Retirado el 2026-10-25, y no por ser malo: es que NO CABE en 16 GB.
#
# Se comprobó TODA la lista de cuantizaciones del repo de unsloth y la
# más pequeña es UD-IQ1_M / UD-IQ2_M / UD-IQ2_XXS a 19.43 GB de pesos:
#
#     pesos  19.43 GB = 18844 MiB   >   VRAM libre 15300 MiB
#
# Da igual el ctx: sin sitio para los pesos no hay nada que recortar. Y
# con --n-cpu-moe (experts a la CPU) el decode se desploma. Es un MoE de
# 30B con 128 experts routed y 6 activos, pero los pesos de TODOS los
# experts están en el GGUF: son 19 GB sí o sí.
#
# Recuperable con:
#   mv models/llama/fired/nemotron.toml models/llama/
# y descargando el GGUF. En una GPU de 24 GB o más entra entero.
#
# NVIDIA-Nemotron-3.5-Lightning-30B-A3B — Config calibrada
#   - MoE 30B / 3B activo
#   - HYBRID: Mamba-2 SSM + MoE + Attention layers (no SWA, es SSM)
#   - Context nativo: 1M tokens (single H100: 256K). En 16GB VRAM: 131K max
#   - Reasoning controlable via enable_thinking
#   - Sampling canónico NVIDIA: temp=1.0, top_p=0.95
#
# Peculiaridades críticas:
#   1. Mamba SSM layers: NO son SWA, son state-space models
#      → en llama.cpp deben funcionar con -fa on (flash attn) en attention
#      → Mamba layers usan cache SSM separado (llama.cpp lo gestiona)
#   2. Reasoning OFF por defecto: enable_thinking=false (ON devora tokens en
#      prompts cortos)
#   3. tool-call-parser: qwen3_coder (en llama.cpp puede que requiera config)
#
# El override del contexto es el canónico ROPERO_NEMOTRON_CTX.
# =============================================================================

[model]
name    = "nemotron"
engine  = "llama-server"
context = 65536

[files]
gguf = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE.gguf"

[download]
repo = "unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
file = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE.gguf"
size = "23.3 GB"

[args]
base = [
    # ---- GPU offload (MoE 30B/3B activo, 16GB VRAM justos) ----
    "--n-gpu-layers", "53",                            # todos los layers GPU-eligible
    "--n-cpu-moe", "${env:ROPERO_NEMOTRON_N_CPU_MOE:-35}",  # expertos MoE en CPU
    "--no-kv-offload",                                 # KV cache en GPU

    # ---- Atención ----
    # -fa on lo pone ropero entry globalmente
    # NO --swa-full (Nemotron usa Mamba SSM, no SWA)

    # ---- KV cache ----
    "--cache-type-k", "q4_0",                          # agresivo (mamba SSM no usa esto, attn sí)
    "--cache-type-v", "q4_0",
    "--cache-prompt",
    "--context-shift",
    "--kv-unified",                                    # single user, unified buffer

    # ---- Modelo / carga ----
    "--jinja",                                         # chat template NVIDIA Nemotron
    "--reasoning-format", "deepseek",                  # limpia tags <think> del output
    "--chat-template-kwargs", '{"enable_thinking": false}',  # OFF por defecto
    "--load-mode", "none",

    # ---- Sampling (canónico NVIDIA) ----
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "0",                                    # desactivado (solo top-p)
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",                         # sin penalty
    "--repeat-last-n", "64",

    # ---- Batching / threads ----
    "--batch-size", "2048",                            # bajado de 4096 (libera compute buffers)
    "--ubatch-size", "512",                            # bajado de 1024
    "--parallel", "1",

    # ---- Generación ----
    "--n-predict", "8192",                             # reasoning puede requerir más
    "--keep", "1024",

    # ---- Misc ----
    # --log-verbosity lo pone ropero entry (default 4)
]
