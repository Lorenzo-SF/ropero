# =============================================================================
# qwen3 — Qwen3-30B-A3B (MoE, 128 expertos, 8 activos)
# =============================================================================

[model]
name    = "qwen3"
engine  = "llama-server"
context = 262144

[files]
gguf = "Qwen3-30B-A3B-NVFP4.gguf"

[build]
repo         = "unsloth/Qwen3-30B-A3B"
quant        = "NVFP4"
imatrix_repo = "qtum/Qwen3-30B-A3B-GGUF"
imatrix_file = "Qwen3-30B-A3B.imatrix"
keep_source  = true
size = "61.1 GB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    "--n-gpu-layers", "49",
    "--n-cpu-moe", "22",
    "--moe-cache","auto",

    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--temp", "0.60",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--n-predict", "8192",

    "--chat-template-file", '/home/lorenzo/models/gguf/qwen3/chat_template.jinja',
    "--reasoning-format", "deepseek",
    "--reasoning-preserve",
    "--reasoning-budget", "32768",

    # "--spec-type", "draft-mtp",
    # "--spec-draft-n-max", "2",
    # "--spec-draft-type-k", "turbo3",
    # "--spec-draft-type-v", "turbo3",
    # "--no-spec-draft-backend-sampling",
    
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = false }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
