# =============================================================================
# 🔥 FIRED — qwen3vector (Qwen3-Embedding-0.6B)
# =============================================================================
#
# Retirado: fuera del scope base. Recuperable con
#   mv models/llama/fired/qwen3vector.toml models/llama/
# y descargando el GGUF.
#
# Bi-encoder del vault. Etapa 1 del retrieval: vectoriza CADA nota por
# separado. NUNCA ve la consulta — por eso es rápido y por eso puede recorrer
# las 10.000.
#
# Puerto fijo (:9993). Con port declarado ropero usa ESE puerto siempre, haya
# --cpu o no: así la lane del vault convive con el coder (:9999) y con el
# fallback (:9996) sin pelear por los slots.
#
# POR QUÉ ESTE Y NO EL `jina-code` DE embed
#   `jina-code-embeddings-1.5b` (embed) es un modelo **de código**, y sigue
#   ahí porque para buscar en código es el correcto. Este vault guarda prosa
#   en castellano, y ahí jina-code no es lo que quieres: no falla, devuelve
#   vectores, y el RAG simplemente es malo.
#
# Medido contra f16 (coseno medio / mínimo):
#     Q4_K_M  0,975 / 0,943    Q5_K_M  0,991 / 0,978    Q8_0  0,999 / 0,999
# Con 639 MB no hay motivo para bajar de Q8_0.
#
# ⚠️ LO QUE HACE ESTE MODELO Y NINGÚN OTRO
# Usa **last-token pooling** y es **instruction-aware**. La doc oficial:
#   "Without last-token pooling and the instruction prefix, retrieval quality
#    collapses."
# Dos cosas, y las dos son invisibles si no las sabes:
#   1. `--pooling last`  → va en los flags de abajo. Si se cae, no peta.
#   2. `Instruct: {tarea}\nQuery:{consulta}` → lo pone el CLIENTE, en la
#      CONSULTA, nunca en los documentos. Si no lo pone, no peta tampoco.
#
# Va forzado a CPU a propósito: 639 MB entrarían de sobra en los ~3 GB que
# dejan libre el coder, pero si lo arrancas en GPU, el día que el coder ocupe
# 16 GB el embedder falla al cargar, y el retrieval —que es lo que tiene que
# estar SIEMPRE vivo— se cae justo cuando más lo necesitas.
#
# El override del contexto es el canónico ROPERO_QWEN3VECTOR_CTX.
# =============================================================================

[model]
name    = "qwen3vector"
engine  = "llama-server"
context = 32768
port    = 9993
alias   = "vector"

[files]
gguf = "Qwen3-Embedding-0.6B-Q8_0.gguf"

[download]
repo = "Qwen/Qwen3-Embedding-0.6B-GGUF"
file = "Qwen3-Embedding-0.6B-Q8_0.gguf"
size = "639 MB"

[args]
base = [
    # ---- FORZADO A CPU, no por defecto sino a propósito ----
    "--n-gpu-layers", "0",

    # ---- Lo que hace que sea un embedder ----
    "--embedding",
    "--pooling", "last",
    "--embd-normalize", "2",                 # coseno: comparable con lo que
                                            # devuelve el reranker

    # ---- Batching: aquí es donde se gana velocidad ----
    # No genera tokens: solo prefill. Por eso un batch enorme no embaralla la
    # respuesta y multiplica el throughput.
    "--batch-size", "4096",
    "--ubatch-size", "4096",
    "--parallel", "4",                       # slots concurrentes

    "--jinja",
]
