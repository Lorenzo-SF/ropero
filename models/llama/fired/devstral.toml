# =============================================================================
# 🔥 FIRED — devstral (Devstral Small 2 24B Instruct)
# =============================================================================
#
# Retirado: fuera del scope base. Recuperable con
#   mv models/llama/fired/devstral.toml models/llama/
# y descargando el GGUF.
#
# Devstral-Small-2-24B-Instruct-2512 (UD-Q4_K_XL) — MoE 24B, thinking off por
# defecto (es un coder: respuesta directa).
#
# El override del contexto es el canónico ROPERO_DEVSTRAL_CTX.
# =============================================================================

[model]
name    = "devstral"
engine  = "llama-server"
context = 131072
alias   = "coder_lite"

[files]
gguf = "Devstral-Small-2-24B-Instruct-2512-UD-Q4_K_XL.gguf"

[download]
repo = "unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF"
file = "Devstral-Small-2-24B-Instruct-2512-UD-Q4_K_XL.gguf"
size = "14.5 GB"

[args]
base = [
    "--n-gpu-layers", "-1",
    "--no-kv-offload",

    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",
    "--cache-prompt",
    "--cache-reuse", "512",
    "--kv-unified",
    "--context-shift",

    "--batch-size", "4096",
    "--ubatch-size", "1024",
    "--parallel", "1",
    "--threads", "12",
    "--threads-batch", "16",
    "--poll", "30",

    "--jinja",
    "--chat-template-kwargs", '{"enable_thinking": false}',
    "--reasoning-format", "deepseek",

    "--temp", "0.6",
    "--top-k", "20",
    "--top-p", "0.95",
    "--min-p", "0.05",
    "--repeat-penalty", "1.0",
    "--repeat-last-n", "64",
    "--seed", "-1",

    "--n-predict", "4096",
    "--keep", "1024",

    "--load-mode", "none",
    "--metrics",
    "--perf",
]
