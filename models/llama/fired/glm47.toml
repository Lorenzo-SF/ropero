# =============================================================================
# GLM-4.7 Flash
# =============================================================================

[model]
name    = "glm47"
engine  = "llama-server"
# context = 524288
# context = 266144
context = 131072

[files]
gguf = "GLM-4.7-Flash-NVFP4.gg"

# [download]
# repo = "unsloth/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF"
# file = "Nemotron-3.5-Lightning-30B-A3B-MXFP4_MOE.gguf"
# size = "17.98 GB"

[build]
repo         = "unsloth/GLM-4.7-Flash"
quant        = "NVFP4"
imatrix_repo = "unsloth/GLM-4.7-Flash"
imatrix_file = "imatrix_unsloth.gguf_file"
keep_source  = true
size = "65.8 GB"

[levels]
list        = ["think", "instruct"]
default     = "think"

[args]
base = [
    "--n-gpu-layers", "54",
    "--n-cpu-moe", "14",
    "--moe-cache","soft", # aqui, auto sube alrededor de un 10%
	
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",

    "--repeat-penalty", "1.0",
    "--repeat-last-n", "64",
    "--n-predict", "8192",
    "--keep", "16384",
    "--reasoning-preserve",
    "--reasoning-budget", "32768",
]

[args.level.think]
base = [
    "--temp", "1.0",
    "--top-p", "0.95",
    "--min-p", "0.01",
    "--reasoning", "true",
    # "--chat-template-kwargs", '{"enable_thinking": true}',
]

[args.level.instruct]
base = [
    "--temp", "0.7",
    "--top-p", "1.0",
    "--min-p", "0.01",
    "--reasoning", "false",
    # "--chat-template-kwargs", '{"enable_thinking": true}',
]
