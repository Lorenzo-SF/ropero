# =============================================================================
# 🔥 FIRED — internivision (InternVL3.5-30B-A3B)
# =============================================================================
#
# Retirado: fuera del scope base. Recuperable con
#   mv models/llama/fired/internivision.toml models/llama/
# y descargando GGUF + mmproj.
#
# (NO estaba en el catálogo de descargas actual — es legacy VLM.)
#
# VLM "el grande con offload" para ttstt: 30B parámetros totales pero solo ~3B
# activos por inferencia (MoE). Pretende ser la mejor opción local para
# análisis multimodal exigente (espectrogramas, multi-imagen para selección de
# segmentos) en hardware con 16 GB de VRAM.
#
# Por qué este y NO InternVL3-38B denso (unsloth/InternVL3-38B-GGUF):
#   El 38B denso trae mmproj de 11.3 GB (InternViT-6B) → total 31 GB, no cabe
#   en 16 GB ni con offload agresivo. El 30B-A3B MoE trae mmproj de 637 MB
#   (InternViT-300M) → total ~19 GB, cabe con --n-gpu-layers parcial.
#
# Por qué MoE > denso para nosotros:
#   Solo activa ~3B por inferencia → velocidad comparable a un denso de 3-7B,
#   capacidad comparable a 30B. Sweet spot para VRAM limitada.
#
# POR QUÉ ngl=-1 (no 999): con 999 el loader FUERZA cargar TODAS las capas
# en GPU, y como el modelo (~19 GB) + KV cache + mmproj no caben en 16 GB,
# falla con CUDA OOM. Con -1 el loader ajusta dinámicamente al máximo que
# quepa en VRAM.
#
# El override del contexto es el canónico ROPERO_INTERNIVISION_CTX.
# =============================================================================

[model]
name    = "internivision"
engine  = "llama-server"
context = 16384

[files]
gguf   = "OpenGVLab_InternVL3_5-30B-A3B-Q4_K_M.gguf"
mmproj = "mmproj-internivision-f16.gguf"

[download]
repo = "bartowski/OpenGVLab_InternVL3_5-30B-A3B-GGUF"
file = "OpenGVLab_InternVL3_5-30B-A3B-Q4_K_M.gguf"
size = "18.6 GB"

# El mmproj de este modelo es legacy: venía renombrado en el catálogo antiguo
# y su ruta DENTRO del repo no quedó registrada en ningún sitio. Lo que sí
# consta es el nombre final en disco (que es lo que busca el modelo), así que
# la ruta del repo se declara en la raíz con ese mismo nombre. Si el repo lo
# guarda con otro nombre, hay que corregir esta línea a mano.
[download.aux.mmproj]
file = "mmproj-internivision-f16.gguf"
name = "mmproj-internivision-f16.gguf"
size = "636 MB"

[args]
base = [
    "--n-gpu-layers", "${env:ROPERO_INTERNIVISION_NGL:--1}",
    "--threads", "12",
    "--threads-batch", "24",
    "--temp", "${env:ROPERO_INTERNIVISION_TEMP:-0.2}",   # baja temperatura para análisis preciso
    "--top-p", "${env:ROPERO_INTERNIVISION_TOP_P:-0.9}",
    "--top-k", "${env:ROPERO_INTERNIVISION_TOP_K:-20}",
    "--repeat-penalty", "${env:ROPERO_INTERNIVISION_REPEAT:-1.05}",
    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",
    "--mmproj", "${mmproj}",
    # n-predict bajo: ttstt solo genera JSON estructurados + razonamiento
    # (CoT). 2048 cubre con margen (~5 frases + JSON). Antes 4096
    # desperdiciaba tokens en预留 KV cache.
    "--n-predict", "2048",
    "--slot-prompt-similarity", "0.8",
    "--keep", "4096",
    "--jinja",
    "--load-mode", "none",
]
