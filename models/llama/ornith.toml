# =============================================================================
# ornith — Ornith-1.5-35B-A3B (MoE híbrido, como el Agents-A1)
# =============================================================================
#
#   - GGUF   : Ornith-1.5-35B-A3B-IQ2_M.gguf  (11.68 GiB)
#   - repo   : bartowski/Ornith-1.5-35B-A3B-GGUF
#   - mmproj  : mmproj-Ornith-1.5-35B-A3B-f16.gguf
#
# ── POR QUÉ ESTE GGUF ───────────────────────────────────────────────────────
# El GGUF que habia (jashepp MXFP4_MOE_Q8_0_F16, 20,7 GB) no cabia.
# En bartowski hay 29 quants, pero el primero que entra entero es el IQ2_M
# (11,68 GiB): el IQ3_XXS (14,29) y el IQ3_XS (15,54) ya no caben ni con un
# contexto de 16K. El oficial ornith-ai solo tiene Q4_K_M (20,22) o mas.
# Es el trade-off de esta VRAM: para el Ornith, el techo de calidad es 2 bits.
# El imatrix de bartowski y el mmproj (0,84 GiB) estan en el mismo repo.
#
# ── ARITMÉTICA DE VRAM (15,32 GiB libres medidos: 15.684 MiB de 15.933) ──────
#   pesos 11,68 GiB
#   KV q4_0 @262144   1,34 GB   (10 capas full-attn x 2 KV x 256 dim x 2 x 0,5 B)
#   compute          ~1,1 GB   (ubatch 256)
#   contexto CUDA    ~0,4 GB
#   --------------------------
#   total           ~14,5 GB   -> cabe el ctx NATIVO entero (262144)
#
# ── ARGUMENTOS QUE IMPORTAN Y POR QUÉ ──────────────────────────────────────
#   · --n-gpu-layers -1: deja que el fitter reparta. Con un número fijo
#     (99) el fitter aborta con "n_gpu_layers already set by user", el modelo
#     se va entero a la GPU a pelo y revienta con cudaMalloc failed.
#   · --load-mode auto: mmap + page cache. Con "none" el fichero entero se
#     copia a la RAM (y aquí no cabe): se pierde el page cache y el SSD deja
#     de servir de "RAM".
#   · KV q4_0: con f16 no cabe y la KV se va a la CPU -> la atención se
#     calcula en la CPU y los t/s se desploman (es lo que le pasó al gpt-oss
#     con 80-100 t/s en vez de 120-130). El KV cuantizado exige -fa on.
#   · Los niveles son los que acepta el chat_template del modelo (ver abajo).
#
# ── QUÉ ES -ngl Y POR QUÉ -1 (y no 99) ──────────────────────────────────────
#   --n-gpu-layers = cuantas capas del modelo se copian a la VRAM.
#     0 = todo en CPU · 99 = "todas las que quepan" · -1 = que lo decida el
#     fitter, que es el default upstream.
#   El fitter (fit_params, on por defecto) mira la VRAM libre y decide el
#   reparto: cuantas capas entran, y con "overflow" por fraccion, o sea que
#   la atencion puede quedarse en la GPU y el MLP ir a la CPU, o al reves.
#   Tambien ajusta el contexto si el usuario no lo ha fijado a mano.
#   PERO si el usuario fija -ngl, el fitter aborta con
#     "n_gpu_layers already set by user to 99, abort"
#   y esa excepcion se CAPTURA y sale como WARN (common_params_fit_exception
#   -> LOG_WRN, status FAILURE). O sea: no se aplica NINGUN ajuste y el
#   servidor carga el modelo entero en la VRAM a pelo -> cudaMalloc failed.
#   Ese es el motivo de -1. El 99 solo tiene sentido si el modelo cabe entero
#   Y quieres quitar el fitter del medio para medir sin ajustes.
#
# ── POR QUÉ batch 512 Y ubatch 256 ─────────────────────────────────────────
#   --batch-size  = tokens del prompt que se pasan al modelo en una llamada.
#   --ubatch-size = tokens que se calculan DE GOLPE en la GPU (micro-lote).
#                  El compute buffer se dimensiona con el Ubatch, no con el
#                  batch, y el buffer mas gordo son los logits:
#                      ubatch x vocab x 4 bytes
#                        1024 -> 1,02 GB   (vocab 248.320)
#                         512 ->  508 MB
#                         256 ->  254 MB
#                         128 ->  127 MB
#   El batch, en cambio, no llena la VRAM: afecta al prefill (cuantos tokens
#   por llamada) y a la RAM del prompt cache. Con el page cache haciendo de
#   RAM, cada GB cuenta, asi que 512 va corto de RAM.
#   El fitter NO toca ni el batch ni el ubatch: hay que fijarlos a mano.
#
# ── REASONING ───────────────────────────────────────────────────────────────
# El chat_template de este modelo NO tiene niveles de esfuerzo: sólo el flag
# enable_thinking (true/false). Así que "medium" y "high" hacen lo mismo; se
# mantienen los tres nombres para no romper los scripts que ya los usan.
#
# El override del contexto es el canónico ROPERO_ORNITH_CTX.
# =============================================================================


# ── Politica de VRAM (2026-10-25) ───────────────────────────────────────────
# Este modelo esta en FULL GPU: todas sus capas y su KV cache en la VRAM,
# sin recorte y sin offload a la CPU. Para que eso sea posible:
#
#   · --n-gpu-layers = 40  = el numero REAL de capas del GGUF (leido de
#     <arch>.block_count de la cabecera del propio GGUF, no de un README).
#     OJO: en llama.cpp, un --n-gpu-layers FIJO (distinto de -1) hace que el
#     fitter ABORTE ("n_gpu_layers already set by user to N, abort"). Con -1
#     el fitter reduce el CONTEXTO hasta que el modelo entero cabe. Aqui no
#     hace falta que recorte nada, porque con la cuantizacion de abajo ya
#     cabe: por eso se pone el numero exacto y no -1.
#   · el KV cache va en la GPU (sin --no-kv-offload) y en q4_0, que es lo
#     que hace que el ctx quepa.
#   · SIN MTP: --spec-type draft-mtp crea un draft context con su propia
#     VRAM y su KV en f16, y el fitter lo mide junto al modelo principal.
#     Con el margen justo, el MTP se come la VRAM y el server no arranca.
#   · SIN --n-cpu-moe: mandar expertos a la CPU obliga a cada token a
#     cruzar el bus PCIe en el decode, y el t/s se desploma.
#
# ctx = 65536: el maximo que cabe con el KV en q4_0 y el resto del modelo
# entero en la GPU, con la formula de KV de llama.cpp
# (n_kv*head_dim*(sizeof(k)+sizeof(v))*n_capas_con_atencion*ctx).
#
# Medido en: RTX 5080 Laptop, 15933 MiB de VRAM.
# =============================================================================

[model]
name    = "ornith"
engine  = "llama-server"
context = 65536

[files]
gguf   = "Ornith-1.5-35B-A3B-IQ2_M.gguf"
[download]
repo = "bartowski/Ornith-1.5-35B-A3B-GGUF"
file = "Ornith-1.5-35B-A3B-IQ2_M.gguf"
size = "12.54 GB"


[levels]
list    = ["low", "medium", "high"]
default = "low"

[flags]
list = []

[args]
base = [
    # ---- GPU offload: que el fitter reparta ----
    "--n-gpu-layers", "40",

    # ---- Attention ----
    "-fa", "on",                            # obligatorio: el KV q4_0 lo exige

    # ---- KV cache ----
    "--cache-type-k", "q4_0",
    "--cache-type-v", "q4_0",
    "--kv-unified",

    # ---- Sampling del Ornith ----
    "--temp", "0.60",
    "--top-k", "35",
    "--top-p", "0.93",
    "--min-p", "0.10",
    "--top-n-sigma", "0.60",
    "--dry-multiplier", "0.8",
    "--dry-base", "1.75",
    "--dry-allowed-length", "3",
    "--dry-penalty-last-n", "1024",
    "--dry-sequence-breaker", '["\\n","```\\n",":","\\t","\\"","|","-","\\}","\\]","/","\\\\"]',
    "--samplers", "top_k;top_p;min_p;dry;temp;top_n_sigma",
    "--reasoning-budget", "32768",

    # ---- Batch ----
    "--batch-size", "512",
    "--ubatch-size", "256",
    "--n-predict", "8192",
    # ---- Modelo / carga ----
    "--jinja",
    "--load-mode", "auto",                   # mmap + page cache, no "none"
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = true }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }

# [args.flag.vision] se ha ido con el mmproj:
#   base    = ["--mmproj", "${mmproj}"]
#   requires = ["mmproj"]
