# =============================================================================
# ornith — Ornith-1.5-35B-A3B (MoE híbrido, como el Agents-A1)
# =============================================================================

[model]
name    = "ornith"
engine  = "llama-server"
context = 131072

[files]
gguf = "Ornith-1.5-35B-A3B-NVFP4.gguf"

[download]
repo = "jashepp/Ornith-1.5-35B-A3B-MXFP4_MOE_Hybrid-Imatrix-GGUF"
file = "Ornith-1.5-35B-A3B-MXFP4_MOE_Q8_0_F16-Imatrix.gguf"
name = "Ornith-1.5-35B-A3B-MXFP4_MOE_Q8_0_F16-Imatrix.gguf"
size = "18.90 GB"

[download.aux.chat_template]
repo = "jashepp/Ornith-1.5-35B-A3B-MXFP4_MOE_Hybrid-Imatrix-GGUF"
file = "chat_template.jinja"
name = "chat_template.jinja"
size = "7.54 KB"
use = "run"
 

[levels]
list    = ["instruct", "think"]
default = "instruct"

[args]
base = [
    "--n-gpu-layers", "44",
    "--n-cpu-moe", "14",
    "--moe-cache","soft",
    "--kv-unified",
    "--kv-offload",
    "--cache-reuse", "512",

    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",

    "--spec-type", "ngram-map-k4v",
    "--spec-ngram-map-k4v-size-n", "24",
    "--spec-ngram-map-k4v-size-m", "48",
    "--spec-ngram-map-k4v-min-hits", "1",
]

[args.level.think]
base = [
    "--top-k", "35",
    "--top-p", "0.93",
    "--min-p", "0.10",
    "--top-n-sigma", "0.60",
    "--dry-multiplier", "0.8",
    "--dry-base", "1.75",
    "--dry-allowed-length", "3",
    "--dry-penalty-last-n", "1024",
    "--samplers", "'top_k;top_p;min_p;dry;temp;top_n_sigma'",
    "--presence-penalty", "0.0",
    "--repeat-penalty", "1.0",
    "--reasoning", "on",
    "--reasoning-format", "auto",
    "--reasoning-budget", "32768",
]

[args.level.instruct]
base = [
    "--temperature", "0.7",
    "--top-p", "0.8",
    "--top-k", "20",
    "--min-p", "0.0",
    "--presence-penalty", "1.5",
    "--repeat-penalty", "1.0",
    "--reasoning", "off",
    "--reasoning-format", "auto",
]

