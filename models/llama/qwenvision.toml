# =============================================================================
# qwenvision — Qwen2.5-VL-7B-Instruct (UD-Q4_K_XL)
# =============================================================================
#
# Visión para ttstt (analizar espectrogramas) y análisis general de imagen.
# Soporte en este build: handlers QWEN25VL en tools/mtmd/models/ ✓ (verificado
# en producción). Pesos: unsloth/Qwen2.5-VL-7B-Instruct-GGUF.
#
# MMPROJ: `Qwen2.5-VL-mmproj.gguf`, el fichero `mmproj-F16.gguf` del repo.
# El nombre final lleva el prefijo porque "mmproj-F16.gguf" existe también en
# el repo de Ministral: sin renombrar, uno pisa al otro.
#
# NOTA histórica: Llama 3.2 Vision murió aquí ("unknown model architecture:
# 'mllama'"); Qwen2.5-VL es su sustituto verificado.
#
# Aquí el mmproj va SIEMPRE en la línea de comandos (no es un flag): el modelo
# es de visión, no de texto con visión opcional.
#
# El override del contexto es el canónico ROPERO_QWENVISION_CTX.
# =============================================================================


# ── Politica de VRAM (2026-10-25) ───────────────────────────────────────────
# Este modelo esta en FULL GPU: todas sus capas y su KV cache en la VRAM,
# sin recorte y sin offload a la CPU. Para que eso sea posible:
#
#   · --n-gpu-layers = 28  = el numero REAL de capas del GGUF (leido de
#     <arch>.block_count de la cabecera del propio GGUF, no de un README).
#     OJO: en llama.cpp, un --n-gpu-layers FIJO (distinto de -1) hace que el
#     fitter ABORTE ("n_gpu_layers already set by user to N, abort"). Con -1
#     el fitter reduce el CONTEXTO hasta que el modelo entero cabe. Aqui no
#     hace falta que recorte nada, porque con la cuantizacion de abajo ya
#     cabe: por eso se pone el numero exacto y no -1.
#   · el KV cache va en la GPU (sin --no-kv-offload) y en q8_0, que es lo
#     que hace que el ctx quepa.
#   · SIN MTP: --spec-type draft-mtp crea un draft context con su propia
#     VRAM y su KV en f16, y el fitter lo mide junto al modelo principal.
#     Con el margen justo, el MTP se come la VRAM y el server no arranca.
#   · SIN --n-cpu-moe: mandar expertos a la CPU obliga a cada token a
#     cruzar el bus PCIe en el decode, y el t/s se desploma.
#
# ctx = 32768: el maximo que cabe con el KV en q8_0 y el resto del modelo
# entero en la GPU, con la formula de KV de llama.cpp
# (n_kv*head_dim*(sizeof(k)+sizeof(v))*n_capas_con_atencion*ctx).
#
# Medido en: RTX 5080 Laptop, 15933 MiB de VRAM.
# =============================================================================

[model]
name    = "qwenvision"
engine  = "llama-server"
context = 32768
port    = 9991

[files]
gguf   = "Qwen2.5-VL-7B-Instruct-UD-Q4_K_XL.gguf"
[download]
repo = "unsloth/Qwen2.5-VL-7B-Instruct-GGUF"
file = "Qwen2.5-VL-7B-Instruct-UD-Q4_K_XL.gguf"
size = "6.10 GB"

# El mmproj también es parte del bundle: sin él el modelo arranca pero no ve.

[args]
base = [
    # -1 (no 999): con un numero fijo el fitter aborta ("n_gpu_layers already set
# by user") y el modelo entero se va a la VRAM a pelo -> cudaMalloc failed.
    "--n-gpu-layers", "28",
    "--threads", "12",
    "--threads-batch", "24",
    "--temp", "${env:ROPERO_QWENVISION_TEMP:-0.2}",     # baja temperatura para análisis preciso
    "--top-p", "${env:ROPERO_QWENVISION_TOP_P:-0.9}",
    "--top-k", "${env:ROPERO_QWENVISION_TOP_K:-20}",
    "--repeat-penalty", "${env:ROPERO_QWENVISION_REPEAT:-1.05}",
    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",
    "--n-predict", "4096",
    "--slot-prompt-similarity", "0.8",
    "--keep", "8192",
    "--jinja",
    "--load-mode", "none",
]
