# =============================================================================
# qwen3 — Qwen3-30B-A3B (MoE, 128 expertos, 8 activos)
# =============================================================================

[model]
name    = "qwen36"
engine  = "llama-server"
context = 196608

[files]
gguf = "Qwen3.6-35B-A3B-NVFP4.gguf"

[build]
repo         = "Qwen/Qwen3.6-35B-A3B"
quant        = "NVFP4"
imatrix_repo = "mradermacher/Qwen3.6-35B-A3B-i1-GGUF"
imatrix_file = "Qwen3.6-35B-A3B.imatrix.gguf"
keep_source  = true
size = "61.1 GB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    "--n-gpu-layers", "49",
    "--n-cpu-moe", "16",
    "--moe-cache","soft",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--temp", "0.60",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--n-predict", "8192",
    "--reasoning-preserve",         
    "--reasoning-budget", "12288",
    "--checkpoint-min-step","256",
    "--spec-default",
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "2",
    "--spec-draft-type-k", "turbo3",
    "--spec-draft-type-v", "turbo3",
    "--no-spec-draft-backend-sampling",
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = true }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
