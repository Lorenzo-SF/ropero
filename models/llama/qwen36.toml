# =============================================================================
# qwen36 — Qwen3.6-35B-A3B (MoE híbrido, 35B totales / 3B activos)
# =============================================================================

[model]
name    = "qwen36"
engine  = "llama-server"
context = 262144

[files]
gguf = "Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"

[download]
repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
file = "Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"
size = "13.21 GB"

[args]
base = [
    # ---- GPU offload: las 40 capas, el numero real del GGUF ----
    # (block_count = 40 leido de la cabecera del GGUF, no de un README)
    "--n-gpu-layers", "41",

    # ---- KV cache ----
    "--cache-type-k", "turbo3",                          # agresivo (10 capas de atencion)
    "--cache-type-v", "turbo3",
    "--cache-prompt",
    "--context-shift",
    "--kv-unified",                                    # single user, unified buffer

    # ---- Positional encoding ----
    "--rope-freq-base", "10000000",                    # theta del repo

    # ---- Sampling ----
    "--temp", "1.0",                                   # canonico del repo
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--repeat-last-n", "64",

    # ---- Batching / threads ----
    "--batch-size", "4096",
    "--ubatch-size", "256",                            # el compute buffer escala con esto
    "--parallel", "1",
    "--threads", "12",
    "--threads-batch", "16",
    "--poll", "30",

    # ---- Generacion ----
    "--n-predict", "4096",
    "--keep", "1024",

    # ---- Modelo / carga ----
    "--jinja",                                         # chat template del modelo
    "--reasoning-format", "deepseek",                  # limpia tags <think>
    "--load-mode", "none",                             # mmap off
    "--metrics",
    "--perf",
]

[levels]
list    = ["low", "medium", "xhigh"]
default = "low"

# El reasoning_effort se pasa como --chat-template-kwargs. El chat template
# del modelo solo conoce low / medium / xhigh: "high" no existe y da error.
[args.level.low]
reasoning_effort = "low"

[args.level.medium]
reasoning_effort = "medium"

[args.level.xhigh]
reasoning_effort = "xhigh"

