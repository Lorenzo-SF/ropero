# =============================================================================
# qwen36 — Qwen3.6-35B-A3B (MoE híbrido, 35B totales / 3B activos)
# =============================================================================
#
#   - GGUF   : Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf  (13.21 GB)
#   - repo   : unsloth/Qwen3.6-35B-A3B-GGUF
#
# ── POR QUÉ ESTE MODELO Y NO OTRO ───────────────────────────────────────────
# Es el MODELO EXCEPCIONAL del roster: el más fuerte que entra entero en la
# GPU de 16 GB con contexto largo.
#
#   (benchmark)                Qwen3.6-35B-A3B   Gemma4-31B   Qwen3.5-27B
#   SWE-bench Verified              73.4 %        66.6 %       75.0 %
#   SWE-bench Pro                   49.5 %        36.9 %       (n/d)
#   Terminal-Bench 2.0              51.5 %        42.9 %       41.6 %
#   SWE-bench Multilingual          67.2 %        51.2 %       70.0 %
#
# Y es MoE: 35B totales pero solo 3B activados por token (8 expertos routed
# + 1 compartido). El decode va rapido para el tamano que tiene.
#
# ── POR QUÉ IQ3_XXS Y NO IQ3_S ──────────────────────────────────────────────
# De los que ofrece unsloth (tamanos reales, no del README):
#   · UD-IQ2_M      11.52 GB   -> 2 bits: la calidad se nota
#   · UD-IQ2_XXS    10.76 GB
#   · UD-IQ3_XXS    13.21 GB   <- este: 3 bits con imatrix
#   · UD-IQ3_S      13.68 GB   -> cabe por los pelos (1 MiB de margen)
#   · UD-Q3_K_M     16.60 GB   -> no cabe entero
#   · UD-IQ4_NL     18.04 GB   -> no cabe
#
# El IQ3_XXS entra con 449 MiB de margen a 262144 de contexto. El IQ3_S
# entraba por los pelos (1 MiB): un cambio de nucleo y reventaba.
# Con IQ2 se ahorran 2 GB de pesos, pero el techo de calidad de 2 bits es
# justo lo que no queremos en el modelo que va a ser el principal.
#
# ── ARITMÉTICA DE VRAM (medida 2026-10-25, con el codigo de llama.cpp) ──────
#
#   pesos (el GGUF entero, leido de sus offsets)      12.3 GB
#   KV cache q4_0 @262144 (10 plenas)    1.41 GB
#   compute buffer (ubatch 256 )                0.330 GB
#   server + holgura (400)                             0.475 GB
#   ---------------------------------------------------------------------
#   total                                             14.49 GB
#   VRAM libre en la RTX 5080                       15300 MiB
#   margen                                              458 MiB
#
# COMO SE CALCULA EL KV (que no es "capas x ctx"):
#   · el KV se asigna en el backend de la CAPA (llama-kv-cache.cpp:217,
#     model.dev_layer(il)): una capa en la CPU se lleva su KV a la CPU.
#   · una capa RECURRENTE (Mamba / gated delta net) no gasta KV: tiene
#     estado RS. Este modelo tiene 30 recurrentes y 10 de atencion.
#   · una capa SWA (ventana deslizante) tiene celdas LIMITADAS, no ctx:
#     size_swa = GGML_PAD(min(ctx, ventana*n_seq_max + n_ubatch), 256).
#   · el KV por token de una capa de atencion es
#     (n_head_kv * head_dim * sizeof(K) + n_head_kv * head_dim * sizeof(V)).
#
# OFFLOAD: NINGUN offload: las 40 capas del modelo y su KV cache
#   entero en la VRAM.
#
# El ctx NATIVO (el context_length del propio GGUF) es 262144.
# El contexto del servidor es min(n_ctx_seq, n_ctx_train): pedir mas
#   que el ctx train no da mas contexto (server-context.cpp:4955).
#
# OJO: en llama.cpp, un --n-gpu-layers FIJO (distinto de -1) hace que el
# fitter ABORTE ("n_gpu_layers already set by user to N, abort"). Con -1 el
# fitter reduce el CONTEXTO hasta que el modelo entero cabe. Aqui el ctx ya
# esta calculado para que quepa, asi que va el numero EXACTO de capas (el
# que sale de <arch>.block_count del GGUF, no de un README).
#
# SIN MTP: --spec-type draft-mtp crea un draft context con su propia VRAM
# y su KV en f16, y el fitter lo mide junto al modelo principal. Con el
# margen justo, el MTP se come la VRAM y el server no arranca.
#
# SIN --no-kv-offload: ese flag mete el KV en la CPU (el KV va al backend
# de la capa; sin el flag, a la GPU).
#
# El override del contexto es el canónico ROPERO_QWEN36_CTX.

[model]
name    = "qwen36"
engine  = "llama-server"
context = 262144

[files]
gguf = "Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"

[download]
repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
file = "Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"
size = "13.21 GB"

[args]
base = [
    # ---- GPU offload: las 40 capas, el numero real del GGUF ----
    # (block_count = 40 leido de la cabecera del GGUF, no de un README)
    "--n-gpu-layers", "40",

    # ---- KV cache ----
    "--cache-type-k", "q4_0",                          # agresivo (10 capas de atencion)
    "--cache-type-v", "q4_0",
    "--cache-prompt",
    "--context-shift",

    # ---- Positional encoding ----
    "--rope-freq-base", "10000000",                    # theta del repo

    # ---- Sampling ----
    "--temp", "1.0",                                   # canonico del repo
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--repeat-last-n", "64",

    # ---- Batching / threads ----
    "--batch-size", "4096",
    "--ubatch-size", "256",                            # el compute buffer escala con esto
    "--parallel", "1",
    "--threads", "12",
    "--threads-batch", "16",
    "--poll", "30",

    # ---- Generacion ----
    "--n-predict", "4096",
    "--keep", "1024",

    # ---- Modelo / carga ----
    "--jinja",                                         # chat template del modelo
    "--reasoning-format", "deepseek",                  # limpia tags <think>
    "--load-mode", "none",                             # mmap off
    "--metrics",
    "--perf",
]

[levels]
list    = ["low", "medium", "xhigh"]
default = "low"

# El reasoning_effort se pasa como --chat-template-kwargs. El chat template
# del modelo solo conoce low / medium / xhigh: "high" no existe y da error.
[args.level.low]
reasoning_effort = "low"

[args.level.medium]
reasoning_effort = "medium"

[args.level.xhigh]
reasoning_effort = "xhigh"

[options]
# La temperatura se puede pisar desde el entorno (lo usa el bench para
# medir siempre en el mismo punto).
list = ["temp"]

[args.option.temp]
replace = "--temp"
base = ["--temp", "${value}"]
