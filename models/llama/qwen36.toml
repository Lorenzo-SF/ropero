# =============================================================================
# qwen36 — Qwen3.6-35B-A3B (MoE híbrido, 35B totales / 3B activos)
# =============================================================================
#
#   - GGUF   : Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf  (13.21 GB)
#   - repo   : unsloth/Qwen3.6-35B-A3B-GGUF
#
# ── POR QUÉ ESTE MODELO Y NO OTRO ───────────────────────────────────────────
# Es el MODELO EXCEPCIONAL del roster: el más fuerte que entra entero en la
# GPU de 16 GB con contexto largo.
#
#   (benchmark)                Qwen3.6-35B-A3B   Gemma4-31B   Qwen3.5-27B
#   SWE-bench Verified              73.4 %        66.6 %       75.0 %
#   SWE-bench Pro                   49.5 %        36.9 %       (n/d)
#   Terminal-Bench 2.0              51.5 %        42.9 %       41.6 %
#   SWE-bench Multilingual          67.2 %        51.2 %       70.0 %
#
# Y es MoE: 35B totales pero solo 3B activados por token (8 expertos routed
# + 1 compartido). El decode va rapido para el tamano que tiene.
#
# ── POR QUÉ IQ3_XXS Y NO IQ3_S ──────────────────────────────────────────────
# De los que ofrece unsloth (tamanos reales, no del README):
#   · UD-IQ2_M      11.52 GB   -> 2 bits: la calidad se nota
#   · UD-IQ2_XXS    10.76 GB
#   · UD-IQ3_XXS    13.21 GB   <- este: 3 bits con imatrix
#   · UD-IQ3_S      13.68 GB   -> cabe por los pelos (1 MiB de margen)
#   · UD-Q3_K_M     16.60 GB   -> no cabe entero
#   · UD-IQ4_NL     18.04 GB   -> no cabe
#
# El IQ3_XXS entra con 449 MiB de margen a 262144 de contexto. El IQ3_S
# entraba por los pelos (1 MiB): un cambio de nucleo y reventaba.
# Con IQ2 se ahorran 2 GB de pesos, pero el techo de calidad de 2 bits es
# justo lo que no queremos en el modelo que va a ser el principal.
#
# ── ARITMÉTICA DE VRAM (medida, no estimada) ────────────────────────────────
# El KV NO lo gastan las 40 capas: la arquitectura es
#     10 x (3 x (Gated DeltaNet -> MoE) -> 1 x (Gated Attention -> MoE))
# o sea 1 de cada 4 capas es de atencion plena. Las otras 30 son recurrentes
# (Gated DeltaNet) y tienen estado recurrente propio, no KV.
#
#   pesos            12.60 GB  (12.598 MiB)
#   KV q4_0 @262144   1.44 GB  (10 capas full-attn x 2 x 256 dim x 2 x 0,5625 B)
#   compute          ~0.34 GB  (ubatch 256)
#   server + holgura  ~0.47 GB
#   --------------------------
#   total            14.51 GB  -> cabe con 449 MiB de margen
#
# El calculo del KV esta CALIBRADO contra los memory breakdown medidos del
# bench del 2026-10-25 (error 0,00 % en los 5 casos). Ver el README.
#
# ── POR QUÉ SIN MTP ─────────────────────────────────────────────────────────
# El GGUF de este repo NO trae la cabeza MTP (nextn_predict_layers = 0), y
# el --spec-type draft-mtp ademas crea un draft context con su propia VRAM
# y su KV en f16. Sin margen para eso, el server no arranca.
#
# ── NIVELES DE RAZONAMIENTO ────────────────────────────────────────────────
# El chat_template del modelo acepta los niveles low / medium / xhigh.
# "high" no existe: el template solo conoce esos tres, y su default es
# xhigh (razona al maximo). Para bajar a medium hay que pasar el nivel
# explicito con --chat-template-kwargs.
#
# El modelo recomienda 262144 de contexto, y avisa de que por debajo de
# 128K se pierde capacidad de thinking.
# =============================================================================

[model]
name    = "qwen36"
engine  = "llama-server"
context = 262144

[files]
gguf = "Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"

[download]
repo = "unsloth/Qwen3.6-35B-A3B-GGUF"
file = "Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf"
size = "13.21 GB"

[args]
base = [
    # ---- GPU offload: las 40 capas, el numero real del GGUF ----
    # (block_count = 40 leido de la cabecera del GGUF, no de un README)
    "--n-gpu-layers", "40",

    # ---- KV cache ----
    "--cache-type-k", "q4_0",                          # agresivo (10 capas de atencion)
    "--cache-type-v", "q4_0",
    "--cache-prompt",
    "--context-shift",
    "--kv-unified",                                    # single user, unified buffer

    # ---- Positional encoding ----
    "--rope-freq-base", "10000000",                    # theta del repo

    # ---- Sampling ----
    "--temp", "1.0",                                   # canonico del repo
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--repeat-last-n", "64",

    # ---- Batching / threads ----
    "--batch-size", "4096",
    "--ubatch-size", "256",                            # el compute buffer escala con esto
    "--parallel", "1",
    "--threads", "12",
    "--threads-batch", "16",
    "--poll", "30",

    # ---- Generacion ----
    "--n-predict", "4096",
    "--keep", "1024",

    # ---- Modelo / carga ----
    "--jinja",                                         # chat template del modelo
    "--reasoning-format", "deepseek",                  # limpia tags <think>
    "--load-mode", "none",                             # mmap off
    "--metrics",
    "--perf",
]

[levels]
list    = ["low", "medium", "xhigh"]
default = "low"

# El reasoning_effort se pasa como --chat-template-kwargs. El chat template
# del modelo solo conoce low / medium / xhigh: "high" no existe y da error.
[args.level.low]
reasoning_effort = "low"

[args.level.medium]
reasoning_effort = "medium"

[args.level.xhigh]
reasoning_effort = "xhigh"

[options]
# La temperatura se puede pisar desde el entorno (lo usa el bench para
# medir siempre en el mismo punto).
list = ["temp"]

[args.option.temp]
replace = "--temp"
base = ["--temp", "${value}"]
