# =============================================================================
# qwen3 — Qwen3-30B-A3B (MoE, 128 expertos, 8 activos)
# =============================================================================

[model]
name    = "qwen3"
engine  = "llama-server"
context = 262144

[files]
gguf = "Qwen3-30B-A3B-NVFP4.gguf"

[build]
repo         = "Qwen/Qwen3-30B-A3B"
quant        = "NVFP4"
imatrix_repo = "bartowski/Qwen_Qwen3-30B-A3B-GGUF"
imatrix_file = "Qwen_Qwen3-30B-A3B.imatrix"
keep_source  = true
size = "61.1 GB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    "--n-gpu-layers", "49",
    "--n-cpu-moe", "22",
    "--moe-cache","auto",

    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--temp", "0.60",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--n-predict", "8192",
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = false }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
