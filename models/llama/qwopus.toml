# =============================================================================
# qwopus — Qwopus3.6-35B-A3B-Coder (MoE híbrido, como el Agents-A1)
# =============================================================================

[model]
name    = "qwopus"
engine  = "llama-server"
context = 262144

[files]
gguf   = "Qwopus3.6-35B-A3B-Coder-vram13-q2ex-imat.gguf"

[download]
repo = "xero0000/Qwopus3.6-35B-A3B-Coder-vram13-GGUF"
file = "Qwopus3.6-35B-A3B-Coder-vram13-q2ex-imat.gguf"
size = "13.53 GB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    # ---- GPU offload: que el fitter reparta ----
    "--n-gpu-layers", "41",

    # ---- Attention ----
    "-fa", "on",                            # obligatorio: el KV q4_0 lo exige

    # ---- KV cache ----
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--kv-unified",

    # ---- Sampling ----
    "--temp", "0.60",
    "--top-k", "40",
    "--top-p", "0.95",
    "--min-p", "0.05",
    "--dry-multiplier", "0.8",
    "--dry-base", "1.75",
    "--dry-allowed-length", "5",
    "--dry-penalty-last-n", "1024",
    "--dry-sequence-breaker", '["\\n","```\\n",":","\\t","\\"","|","-","\\}","\\]","/","\\\\"]',
    "--samplers", "min_p;top_k;top_p;temp;dry",

    # ---- Batch ----
    "--batch-size", "512",
    "--ubatch-size", "256",
    "--n-predict", "8192",
    # ---- Modelo / carga ----
    "--jinja",
    "--load-mode", "auto",                   # mmap + page cache, no "none"
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = false }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }

