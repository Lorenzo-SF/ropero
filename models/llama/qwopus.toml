# =============================================================================
# qwopus — Qwopus3.6-35B-A3B-Coder (MoE híbrido, como el Agents-A1)
# =============================================================================
#
#   - GGUF   : Qwopus3.6-35B-A3B-Coder-vram13-q2ex-imat.gguf  (12.60 GiB)
#   - repo   : xero0000/Qwopus3.6-35B-A3B-Coder-vram13-GGUF
#
# ── POR QUÉ ESTE GGUF ───────────────────────────────────────────────────────
# El GGUF que habia (jashepp MXFP4_MOE_Q8_0_F16, 20,7 GB) no cabia.
# De los que hay:
#   · mradermacher  : Q2_K 12,34 | Q3_K_S 14,48 (no cabe) | Q3_K_M 15,99 (no)
#   · Jackrong (MTP): Q3_K_M 15,99 (no cabe)
#   · xero0000      : "vram13" 12,60 -> quant pensado para 13 GB de VRAM
# Se queda el vram13: es 0,26 GB mas grande que el Q2_K (mas bits) y hay
# margen para el contexto. Con vision no hay mmproj en ese repo (este repo
# solo trae el GGUF), asi que este modelo queda en modo texto.
# El chat_template ya va dentro del GGUF: se deja de descargar aparte.
#
# ── ARITMÉTICA DE VRAM (15,32 GiB libres medidos: 15.684 MiB de 15.933) ──────
#   pesos 12,60 GiB
#   KV q4_0 @131072   0,67 GB   (10 capas full-attn x 2 KV x 256 dim x 2 x 0,5 B)
#   compute          ~1,1 GB   (ubatch 256)
#   contexto CUDA    ~0,4 GB
#   --------------------------
#   total           ~14,8 GB   -> cabe con 0,5 GB de margen (el ctx nativo 262144 no: 15,5 GB)
#
# ── ARGUMENTOS QUE IMPORTAN Y POR QUÉ ──────────────────────────────────────
#   · --n-gpu-layers -1: deja que el fitter reparta. Con un número fijo
#     (99) el fitter aborta con "n_gpu_layers already set by user", el modelo
#     se va entero a la GPU a pelo y revienta con cudaMalloc failed.
#   · --load-mode auto: mmap + page cache. Con "none" el fichero entero se
#     copia a la RAM (y aquí no cabe): se pierde el page cache y el SSD deja
#     de servir de "RAM".
#   · KV q4_0: con f16 no cabe y la KV se va a la CPU -> la atención se
#     calcula en la CPU y los t/s se desploman (es lo que le pasó al gpt-oss
#     con 80-100 t/s en vez de 120-130). El KV cuantizado exige -fa on.
#   · Los niveles son los que acepta el chat_template del modelo (ver abajo).
#
# ── REASONING ───────────────────────────────────────────────────────────────
# El chat_template de este modelo NO tiene niveles de esfuerzo: sólo el flag
# enable_thinking (true/false). Así que "medium" y "high" hacen lo mismo; se
# mantienen los tres nombres para no romper los scripts que ya los usan.
#
# El override del contexto es el canónico ROPERO_QWOPUS_CTX.
# =============================================================================

[model]
name    = "qwopus"
engine  = "llama-server"
context = 131072

[files]
gguf   = "Qwopus3.6-35B-A3B-Coder-vram13-q2ex-imat.gguf"

[download]
repo = "xero0000/Qwopus3.6-35B-A3B-Coder-vram13-GGUF"
file = "Qwopus3.6-35B-A3B-Coder-vram13-q2ex-imat.gguf"
size = "12.60 GiB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    # ---- GPU offload: que el fitter reparta ----
    "--n-gpu-layers", "-1",

    # ---- Attention ----
    "-fa", "on",                            # obligatorio: el KV q4_0 lo exige

    # ---- KV cache ----
    "--cache-type-k", "q4_0",
    "--cache-type-v", "q4_0",
    "--kv-unified",

    # ---- Sampling ----
    "--temp", "0.60",
    "--top-k", "40",
    "--top-p", "0.95",
    "--min-p", "0.05",
    "--dry-multiplier", "0.8",
    "--dry-base", "1.75",
    "--dry-allowed-length", "5",
    "--dry-penalty-last-n", "1024",
    "--dry-sequence-breaker", '["\\n","```\\n",":","\\t","\\"","|","-","\\}","\\]","/","\\\\"]',
    "--samplers", "min_p;top_k;top_p;temp;dry",

    # ---- Batch ----
    "--batch-size", "512",
    "--ubatch-size", "256",
    "--n-predict", "8192",
    "--parallel", "1",

    # ---- Modelo / carga ----
    "--jinja",
    "--load-mode", "auto",                   # mmap + page cache, no "none"
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = true }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
