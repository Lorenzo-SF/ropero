# =============================================================================
# granite — granite-4.0-h-small (MoE híbrido Mamba, 40 capas, 10 expertos)
# =============================================================================

[model]
name    = "granite"
engine  = "llama-server"
# context = 5242887
context = 266144
# context = 131072

[files]
# gguf = "granite-4.0-h-small-IQ4_NL.gguf"
gguf = "granite-4.0-h-small-MXFP4_MOE.gguf"

[build]
repo         = "ibm-granite/granite-4.0-h-small"
quant        = "IQ4_NL"
imatrix_repo = "unsloth/granite-4.0-h-small-GGUF"
imatrix_file = "imatrix_unsloth.gguf_file"
keep_source  = true
size = "64.4 GB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    "--n-gpu-layers", "41",
    "--n-cpu-moe", "18",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--cache-prompt",
    "--temp", "0.60",
    "--top-k", "40",
    "--top-p", "0.95",
    "--min-p", "0.05",
    "--n-predict", "8192",
    
]
