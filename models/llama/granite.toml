# =============================================================================
# granite — granite-4.0-h-small (MoE híbrido Mamba2 + atención, 40 capas,
# 72 expertos, 10 activos, ctx nativo 1.048.576)
# =============================================================================

[model]
name    = "granite"
engine  = "llama-server"
# context = 5242887
context = 266144
# context = 131072

[files]
gguf = "granite-4.0-h-small-NVFP4.gguf"
# El template oficial de IBM va como auxiliar descargado (ver nemotron.toml:
# el mismo problema y la misma solución). Antes era una ruta ABSOLUTA
# escrita a mano ("/home/lorenzo/..."), que sólo funcionaba en la máquina
# donde se escribió y que rompía el arranque si el fichero no estaba.
chat_template = "chat_template.jinja"

[download]
repo = "unsloth/granite-4.0-h-small-GGUF"
file = "granite-4.0-h-small-NVFP4.gguf"
size = "19.83 GB"

[download.aux.chat_template]
repo = "ibm-granite/granite-4.0-h-small"
file = "chat_template.jinja"
name = "chat_template.jinja"
size = "6.42 KB"
use = "run"

[download.aux.imatrix]
repo = "unsloth/granite-4.0-h-small-GGUF"
file = "imatrix_unsloth.gguf_file"
name = "imatrix_unsloth.gguf_file"
size = "0.11 GB"

[build]
repo         = "ibm-granite/granite-4.0-h-small"
quant        = "NVFP4"
imatrix_repo = "unsloth/granite-4.0-h-small-GGUF"
imatrix_file = "imatrix_unsloth.gguf_file"
keep_source  = true
size = "64.4 GB"

[levels]
list    = ["low", "medium", "high"]
default = "medium"

[args]
base = [
    "--n-gpu-layers", "41",
    "--n-cpu-moe", "13",
    "--moe-cache","soft",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--cache-prompt",
    "--temp", "0.60",
    "--top-k", "40",
    "--top-p", "0.95",
    "--min-p", "0.05",
    "--n-predict", "8192",
    "--chat-template-file", "${chat_template}",
    "--reasoning-format", "deepseek",
    "--reasoning-preserve",
    "--reasoning-budget", "32768",
    "--spec-default",]
