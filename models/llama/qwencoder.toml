# =============================================================================
# qwencoder — Qwen3-Coder-30B-A3B-Instruct (MoE 128 expertos, 8 activos)
# =============================================================================
#
#   - GGUF   : Qwen3-Coder-30B-A3B-Instruct-UD-IQ3_XXS.gguf  (11.97 GiB)
#   - repo   : unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF
#
# ── POR QUÉ ESTE GGUF ───────────────────────────────────────────────────────
# El GGUF se queda (el UD-IQ3_XXS de unsloth: 11,97 GB, con imatrix).
# El problema era la KV: este modelo tiene las 48 capas de atencion completa
# (no es hibrido), asi que la KV son 98.304 B/token: a 131072 en f16 son
# 12,88 GB (imposible) y en q8_0 son 6,44 GB (tampoco). Con q4_0 son 3,22 GB
# a 131072 y 6,75 GB a 262144.
# bartowski no tiene este modelo; unsloth si.
#
# El ctx NATIVO es 262144 y cabe con q4_0, pagando con --n-cpu-moe 22 (los
# experts de las 22 primeras capas a la CPU). Es el modelo que peor sale
# de todo el roster en decode: 22 de sus 48 capas cruzan el bus PCIe en
# cada token. Si el ctx largo no es lo prioritario, ROPERO_QWENCODER_CTX
# lo baja y el offload se aligera.
#
# ── ARITMÉTICA DE VRAM (medida 2026-10-25, con el codigo de llama.cpp) ──────
#
#   pesos (el GGUF entero, leido de sus offsets)      11.9 GB
#   KV cache q4_0 @262144 (48 plenas)    6.75 GB
#   compute buffer (ubatch 512 )                0.338 GB
#   server + holgura (400)                             0.475 GB
#   ---------------------------------------------------------------------
#   total                                             14.55 GB
#   VRAM libre en la RTX 5080                       15300 MiB
#   margen                                              403 MiB
#
# COMO SE CALCULA EL KV (que no es "capas x ctx"):
#   · el KV se asigna en el backend de la CAPA (llama-kv-cache.cpp:217,
#     model.dev_layer(il)): una capa en la CPU se lleva su KV a la CPU.
#   · una capa RECURRENTE (Mamba / gated delta net) no gasta KV: tiene
#     estado RS. Este modelo tiene 0 recurrentes y 48 de atencion.
#   · una capa SWA (ventana deslizante) tiene celdas LIMITADAS, no ctx:
#     size_swa = GGML_PAD(min(ctx, ventana*n_seq_max + n_ubatch), 256).
#   · el KV por token de una capa de atencion es
#     (n_head_kv * head_dim * sizeof(K) + n_head_kv * head_dim * sizeof(V)).
#
# OFFLOAD: --n-cpu-moe 22: los EXPERTS de las 22 primeras capas van a la
#   CPU. Es la via BARATA: la atencion y el KV cache siguen
#   enteros en la GPU. Cada token cruza el bus PCIe, asi que
#   el decode baja, pero no se desploma.
#
# El ctx NATIVO (el context_length del propio GGUF) es 262144.
# El contexto del servidor es min(n_ctx_seq, n_ctx_train): pedir mas
#   que el ctx train no da mas contexto (server-context.cpp:4955).
#
# OJO: en llama.cpp, un --n-gpu-layers FIJO (distinto de -1) hace que el
# fitter ABORTE ("n_gpu_layers already set by user to N, abort"). Con -1 el
# fitter reduce el CONTEXTO hasta que el modelo entero cabe. Aqui el ctx ya
# esta calculado para que quepa, asi que va el numero EXACTO de capas (el
# que sale de <arch>.block_count del GGUF, no de un README).
#
# SIN MTP: --spec-type draft-mtp crea un draft context con su propia VRAM
# y su KV en f16, y el fitter lo mide junto al modelo principal. Con el
# margen justo, el MTP se come la VRAM y el server no arranca.
#
# SIN --no-kv-offload: ese flag mete el KV en la CPU (el KV va al backend
# de la capa; sin el flag, a la GPU).
#
# El override del contexto es el canónico ROPERO_QWENCODER_CTX.

[model]
name    = "qwencoder"
engine  = "llama-server"
context = 262144

[files]
gguf   = "Qwen3-Coder-30B-A3B-Instruct-UD-IQ3_XXS.gguf"

[download]
repo = "unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF"
file = "Qwen3-Coder-30B-A3B-Instruct-UD-IQ3_XXS.gguf"
size = "11.97 GB"

[args]
base = [
    # ---- GPU offload: que el fitter reparta ----
    "--n-gpu-layers", "48",
    "--n-cpu-moe", "${env:ROPERO_QWENCODER_N_CPU_MOE:-22}",   # experts de las 22 primeras capas a la CPU

    # ---- Attention ----
    "-fa", "on",                            # obligatorio: el KV q4_0 lo exige

    # ---- KV cache ----
    "--cache-type-k", "q4_0",
    "--cache-type-v", "q4_0",

    # ---- Sampling del Qwen3-Coder ----
    "--temp", "0.7",
    "--top-p", "0.8",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.05",
    "--repeat-last-n", "64",
    "--reasoning-format", "deepseek",
    "--keep", "1024",

    # ---- Batch ----
    "--batch-size", "512",
    "--ubatch-size", "512",
    "--n-predict", "8192",
    # ---- Modelo / carga ----
    "--jinja",
    "--load-mode", "auto",                   # mmap + page cache, no "none"
]

[options]
# La temperatura se puede pisar desde el entorno (lo usa el bench para
# medir siempre en el mismo punto: el banco pide 0-0,2 y con temp 1.0 se
# esta midiendo el sampler, no el modelo).
list = ["temp"]

[args.option.temp]
replace = "--temp"
base = ["--temp", "${value}"]
