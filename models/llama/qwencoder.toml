# =============================================================================
# qwencoder — Qwen3-Coder-30B-A3B-Instruct (MoE 128 expertos, 8 activos)
# =============================================================================

[model]
name    = "qwencoder"
engine  = "llama-server"
context = 262144

[files]
gguf   = "Qwen3-Coder-30B-A3B-Instruct-IQ4_XS.gguf"

# ── CÓMO SE FABRICA ─────────────────────────────────────────────────────────
#
# Este GGUF no se descarga: se FABRICA. La seccion [build] es la receta, y
# sus claves son las mismas que acepta "ropero gguffer". El que la ejecuta
# es el gguffer de verdad, asi que "ropero install models qwencoder" y el
# comando de abajo hacen EXACTAMENTE lo mismo.
#
#   ropero gguffer --repo Qwen/Qwen3-Coder-30B-A3B-Instruct \
#       --quant IQ4_XS \
#       --imatrix-repo n19875624/Qwen3-Coder-30B-A3B-Instruct-code-imatrix-GGUF \
#       --imatrix-file code.imatrix \
#       --keep-source
#
# El imatrix es el "code" (el que se calculo con codigo real de la
# herramienta), que es el que mejora al coder: el modelo es un coder, y el
# imatrix "code" dice que tensores importan mas para escribir codigo que
# para hablar.
[build]
repo         = "Qwen/Qwen3-Coder-30B-A3B-Instruct"
quant        = "IQ4_XS"
imatrix_repo = "n19875624/Qwen3-Coder-30B-A3B-Instruct-code-imatrix-GGUF"
imatrix_file = "code.imatrix"
keep_source  = true
# Los pesos que se bajan al fabricar (tamano medido del repo de HF).
size = "61.1 GB"

[download]
repo = "n19875624/Qwen3-Coder-30B-A3B-Instruct-code-imatrix-GGUF"
file = "Qwen3-Coder-30B-A3B-Instruct-code-imatrix-IQ4_XS.gguf"
size = "16.37 GB"

[args]
base = [
    # ---- GPU offload: que el fitter reparta ----
    "--n-gpu-layers", "49",
    "--n-cpu-moe", "${env:ROPERO_QWENCODER_N_CPU_MOE:-22}",   # experts de las 22 primeras capas a la CPU

    # ---- Attention ----
    "-fa", "on",                            # obligatorio: el KV q4_0 lo exige

    # ---- KV cache ----
    "--cache-type-k", "q4_0",
    "--cache-type-v", "q4_0",

    # ---- Sampling del Qwen3-Coder ----
    "--temp", "0.7",
    "--top-p", "0.8",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.05",
    "--repeat-last-n", "64",
    "--reasoning-format", "deepseek",
    "--keep", "1024",

    # ---- Batch ----
    "--batch-size", "512",
    "--ubatch-size", "512",
    "--n-predict", "8192",
    # ---- Modelo / carga ----
    "--jinja",
    "--load-mode", "auto",                   # mmap + page cache, no "none"
]

