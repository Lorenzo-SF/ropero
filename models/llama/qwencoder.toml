# =============================================================================
# qwencoder — Qwen3-Coder-30B-A3B-Instruct (MoE 128 expertos, 8 activos)
# =============================================================================

[model]
name    = "qwencoder"
engine  = "llama-server"
context = 131072

[files]
gguf = "Qwen3-Coder-30B-A3B-Instruct-NVFP4.gguf" # ok, 1.6 - 1.8 k entrada, 35 de salida
# gguf = "Qwen3-Coder-30B-A3B-Instruct-MXFP4_MOE.gguf" # caca, baja el rendimiento de la entrada a unos 200t/s respecto al NVFP4, la generacion es similar (quiza 3 o 5 t/s mas)
# gguf = "Qwen3-Coder-30B-A3B-Instruct-IQ4_NL.gguf" # procesamiento un poco mejor que el MXFP4 de entrada, de salida igual
[build]
repo         = "Qwen/Qwen3-Coder-30B-A3B-Instruct"
quant        = "IQ4_NL"
imatrix_repo = "n19875624/Qwen3-Coder-30B-A3B-Instruct-code-imatrix-GGUF"
imatrix_file = "code.imatrix"
keep_source  = true
size = "61.1 GB"

[args]
base = [
    "--n-gpu-layers", "49",
    "--n-cpu-moe", "18",   # experts de las 22 primeras capas a la CPU
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--temp", "0.7",
    "--top-p", "0.8",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.05",
    "--repeat-last-n", "64",
    "--reasoning-format", "deepseek",
    "--keep", "1024",
    "--n-predict", "8192",
]

# nota: activar el mtp requiere perder un montono de ctx, no compensa