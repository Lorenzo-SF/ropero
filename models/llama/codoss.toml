# =============================================================================
# codoss — gpt-oss-20b coder (xCloud GGUF) con razonamiento por nivel
# =============================================================================
#
# El nivel de razonamiento lo fija el nivel elegido (`ropero codoss --high`)
# y se pasa al template como `--chat-template-kwargs {"reasoning_effort": ...}`.
# ROPERO_CODOSS_REASONING (low|medium|high) lo sobreescribe.
#
# El flag se emite UNA SOLA VEZ, desde [args.level.<nivel>]: duplicado en
# [args].base, llama.cpp se queda con el último y el override por entorno
# deja de funcionar.
# =============================================================================

[model]
name    = "codoss"
engine  = "llama-server"
context = 131072

[files]
gguf = "gpt-oss-20b-code.gguf"

[download]
repo = "xCloudinfo/gpt-oss-20b-Code-xCloud-GGUF"
file = "gpt-oss-20b-code.gguf"
size = "13.2 GB"

[levels]
list    = ["low", "medium", "high"]
default = "medium"

[args]
base = [
    "--n-gpu-layers", "99",
    "--temp", "1.0",
    "--min-p", "0.0",
    "--top-p", "1.0",
    "--top-k", "0",
    "--threads", "12",
    "--threads-batch", "24",
    "--reasoning-format", "auto",
    "--batch-size", "4096",
    "--ubatch-size", "1024",
    "--n-predict", "16384",
    "--slot-prompt-similarity", "0.2",
    "--keep", "8192",
    # El nivel de razonamiento lo inyecta [args.level.<nivel>]; duplicar el
    # flag aquí haría que llama.cpp descartara el override por entorno.
    "--cache-type-k", "${env:ROPERO_CODOSS_KV:-q8_0}",
    "--cache-type-v", "${env:ROPERO_CODOSS_KV:-q8_0}",
    "--jinja",
    "--kv-unified",
    "--load-mode", "auto",
]

[args.level.low]
reasoning_effort = "${env:ROPERO_CODOSS_REASONING:-low}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "6",
    "--spec-ngram-simple-size-m", "16",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "2",
]

[args.level.medium]
reasoning_effort = "${env:ROPERO_CODOSS_REASONING:-medium}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "12",
    "--spec-ngram-simple-size-m", "48",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "3",
]

[args.level.high]
reasoning_effort = "${env:ROPERO_CODOSS_REASONING:-high}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "8",
    "--spec-ngram-simple-size-m", "32",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "4",
]
