# =============================================================================
# gptoss — gpt-oss-20b (MXFP4) con razonamiento por nivel
# =============================================================================

[model]
name    = "gptoss"
engine  = "llama-server"
context = 131072

[files]
gguf = "gpt-oss-20b-MXFP4_MOE.gguf"

[download]
repo = "FreedomAISVR/gpt-oss-20B-NVFP4-GGUF"
file = "gpt-oss-20b-nvfp4.gguf"
size = "12.7 GB"

[levels]
list    = ["low", "medium", "high"]
default = "medium"

[args]
base = [
    "--n-gpu-layers", "99",
    "--moe-cache","auto",

    "--temp", "0.8",
    "--top-k", "40",
    "--min-p", "0.05",
    "--reasoning-format", "auto",
    "--n-predict", "16384",
    "--slot-prompt-similarity", "0.2",
    "--keep", "8192",
    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",
]

[args.level.low]
chat_template_kwargs = { reasoning_effort = "low" }
base = [
    "--spec-type","ngram-simple",
    "--spec-ngram-simple-size-n","6",
    "--spec-ngram-simple-size-m","16",
    "--spec-draft-n-min","1",
    "--spec-draft-n-max","2"
]


[args.level.medium]
chat_template_kwargs = { reasoning_effort = "medium" }
base = [
    "--spec-type","ngram-simple",
    "--spec-ngram-simple-size-n","12",
    "--spec-ngram-simple-size-m","48",
    "--spec-draft-n-min","1",
    "--spec-draft-n-max","3"
]


[args.level.high]
chat_template_kwargs = { reasoning_effort = "high" }
base = [
    "--spec-type","ngram-simple",
    "--spec-ngram-simple-size-n","8",
    "--spec-ngram-simple-size-m","32",
    "--spec-draft-n-min","1",
    "--spec-draft-n-max","4"
]

