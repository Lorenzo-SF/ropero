# =============================================================================
# gptoss — gpt-oss-20b (UD-Q8_K_XL) con razonamiento por nivel
# =============================================================================

[model]
name    = "gptoss"
engine  = "llama-server"
context = 131072

[files]
gguf = "openai_gpt-oss-20b-MXFP4.gguf"

[download]
repo = "bartowski/openai_gpt-oss-20b-GGUF-MXFP4-Experimental"
file = "openai_gpt-oss-20b-MXFP4.gguf"
size = "13.2 GB"

[levels]
list    = ["low", "medium", "high"]
default = "medium"

[aliases]
verifier = "high"
designer = "medium"

[args]
base = [
    "--n-gpu-layers", "99",
    "--temp", "1.0",
    "--min-p", "0.0",
    "--top-p", "1.0",
    "--top-k", "0",
    "--threads", "12",
    "--threads-batch", "24",
    "--reasoning-format", "auto",
    "--batch-size", "4096",
    "--ubatch-size", "1024",
    "--n-predict", "16384",
    "--slot-prompt-similarity", "0.2",
    "--keep", "8192",
    "--chat-template-kwargs", '{"reasoning_effort": "${env:ROPERO_GPTOSS_REASONING:-medium}"}',
    "--cache-type-k", "${env:ROPERO_GPTOSS_KV:-f16}",
    "--cache-type-v", "${env:ROPERO_GPTOSS_KV:-f16}",
    "--jinja",
    "--kv-unified",
    "--kv-offload",
    "--load-mode", "auto",
]

[args.level.low]
reasoning_effort = "low"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "6",
    "--spec-ngram-simple-size-m", "16",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "2",
]

[args.level.medium]
reasoning_effort = "medium"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "12",
    "--spec-ngram-simple-size-m", "48",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "3",
]

[args.level.high]
reasoning_effort = "high"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "8",
    "--spec-ngram-simple-size-m", "32",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "4",
]
