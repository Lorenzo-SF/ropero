# =============================================================================
# gptoss — gpt-oss-20b (MXFP4) con razonamiento por nivel
# =============================================================================
#
# El nivel de razonamiento lo fija el nivel elegido (`ropero gptoss --high`)
# y se pasa al template como `--chat-template-kwargs {"reasoning_effort": ...}`.
# ROPERO_GPTOSS_REASONING (low|medium|high) lo sobreescribe: es la forma de
# forzar un nivel sin tocar la línea de órdenes. Sin ese env var, cada nivel
# usa el suyo.
#
# El flag se emite UNA SOLA VEZ, desde [args.level.<nivel>]. Antes estaba
# tambien en [args].base: no rompia nada (llama.cpp se queda con el ultimo
# valor, que es el del nivel) pero el base pisaba la intencion y el
# comentario decia una cosa y el codigo otra.
#
# El KV va en q8_0, no en f16: a 131072 la KV f16 son 3,22 GB y con el modelo
# (11,2 GB) + compute (0,73 GB) no caben en los 15,93 GB de VRAM -> la KV se
# va a la CPU, la atencion se calcula en la CPU y los t/s caen de 120-130 a
# 80-100. Con q8_0 la KV son 1,61 GB y todo cabe.
#
# ── EL SAMPLING: POR QUÉ --top-k 40 Y NO 0 ──────────────────────────────────
# MEDIDO en la maquina (RTX 5080 Laptop, gpt-oss-20b MXFP4, 11,2 GB):
#
#   eval time = 15,62 ms por token   ->  64 tokens/s
#   techo teorico (solo los pesos)   ->  11,2 GB / 1,55 TB/s = 7,2 ms -> 138 t/s
#   prompt eval time = 0,37 ms/token -> 2694 t/s   (el prefill va perfecto)
#
# O sea: 7,2 ms de GPU y ~8,4 ms de CPU. La GPU esta esperando al sampler.
# El sampler de llama.cpp corre en la CPU, y con --top-k 0 --min-p 0.0
# --top-p 1.0 NO HAY NINGUN RECORTE: tiene que procesar los 201.088 tokens
# (softmax completo + sort) en cada token -> ~8 ms.
# Con --top-k 40 el sort es sobre 40 y el coste cae a ~0,5 ms. El recorte solo
# toca la cola lejana de la distribucion (con temp 1.0, prob < 1e-4), asi que
# el cambio de calidad es minimo. Top-k 40 es el valor que usa el propio
# sampler de gpt-oss cuando top_k no es 0.
# Se puede cambiar con ROPERO_GPTOSS_TOPK (0 = el sampling oficial, lento).
#
# ── POR QUÉ --cache-prompt Y --context-shift ───────────────────────────────
# Sin cache-prompt, cada turno vuelve a prefillar el contexto entero: con
# 14.000 tokens de prompt son 5,2 s de prefill (5203 ms / 14017 tokens)
# por turno, en vez de reusar lo ya calculado. Con cache-prompt el prefill
# se reutiliza y el context-shift hace que el contexto desbordado se
# recorte solo.
# =============================================================================
#
# ── QUÉ ES -ngl Y POR QUÉ -1 (y no 99) ──────────────────────────────────────
#   --n-gpu-layers = cuantas capas del modelo se copian a la VRAM.
#     0 = todo en CPU · 99 = "todas las que quepan" · -1 = que lo decida el
#     fitter, que es el default upstream.
#   El fitter (fit_params, on por defecto) mira la VRAM libre y decide el
#   reparto: cuantas capas entran, y con "overflow" por fraccion, o sea que
#   la atencion puede quedarse en la GPU y el MLP ir a la CPU, o al reves.
#   Tambien ajusta el contexto si el usuario no lo ha fijado a mano.
#   PERO si el usuario fija -ngl, el fitter aborta con
#     "n_gpu_layers already set by user to 99, abort"
#   y esa excepcion se CAPTURA y sale como WARN (common_params_fit_exception
#   -> LOG_WRN, status FAILURE). O sea: no se aplica NINGUN ajuste y el
#   servidor carga el modelo entero en la VRAM a pelo -> cudaMalloc failed.
#   Ese es el motivo de -1. El 99 solo tiene sentido si el modelo cabe entero
#   Y quieres quitar el fitter del medio para medir sin ajustes.
#
# ── POR QUÉ batch 512 Y ubatch 256 ─────────────────────────────────────────
#   --batch-size  = tokens del prompt que se pasan al modelo en una llamada.
#   --ubatch-size = tokens que se calculan DE GOLPE en la GPU (micro-lote).
#                  El compute buffer se dimensiona con el ubatch, no con el
#                  batch, y el buffer mas gordo son los logits:
#                      ubatch x vocab x 4 bytes
#                        1024 -> 1,02 GB   (vocab 248.320)
#                         512 ->  508 MB
#                         256 ->  254 MB
#                         128 ->  127 MB
#   El batch, en cambio, no llena la VRAM: afecta al prefill (cuantos tokens
#   por llamada) y a la RAM del prompt cache. Con el page cache haciendo de
#   RAM, cada GB cuenta, asi que va corto de RAM.
#   El fitter NO toca ni el batch ni el ubatch: hay que fijarlos a mano.

[model]
name    = "gptoss"
engine  = "llama-server"
context = 131072

[files]
gguf = "openai_gpt-oss-20b-MXFP4.gguf"

[download]
repo = "bartowski/openai_gpt-oss-20b-GGUF-MXFP4-Experimental"
file = "openai_gpt-oss-20b-MXFP4.gguf"
size = "11.2 GB"

[levels]
list    = ["low", "medium", "high"]
default = "medium"

[aliases]
verifier = "high"
designer = "medium"

[args]
base = [
    # -1 = que lo reparta el fitter. Con 99 el fitter aborta ("n_gpu_layers
    # already set by user to 99, abort"), deja de ajustar nada y el modelo
    # se carga entero en la VRAM a pelo. Ver la cabecera.
    "--n-gpu-layers", "25",
    "--temp", "1.0",
    "--min-p", "0.0",
    "--top-p", "1.0",
    # 40 y no 0: sin recorte, el sampler procesa los 201.088 tokens en la CPU
    # por token (~8 ms, la mitad del tiempo de generacion). Ver la cabecera.
    "--top-k", "${env:ROPERO_GPTOSS_TOPK:-40}",
    "--threads", "12",
    "--threads-batch", "24",
    "--reasoning-format", "auto",
    # 512/256 y no 4096/1024: los logits son ubatch x vocab x 4 bytes y con
    # el vocab de 201.088 a 1024 son 825 MB solo de logits.
    "--batch-size", "512",
    "--ubatch-size", "256",
    "--n-predict", "16384",
    "--slot-prompt-similarity", "0.2",
    "--keep", "8192",
    # Reusar el prefill entre turnos y recortarlo solo si desborda.
    "--cache-prompt",
    "--context-shift",
    "--cache-type-k", "${env:ROPERO_GPTOSS_KV:-q8_0}",
    "--cache-type-v", "${env:ROPERO_GPTOSS_KV:-q8_0}",
    "--jinja",
    "--kv-unified",
    "--kv-offload",
    "--load-mode", "auto",
]

[args.level.low]
reasoning_effort = "${env:ROPERO_GPTOSS_REASONING:-low}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "6",
    "--spec-ngram-simple-size-m", "16",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "2",
]

[args.level.medium]
reasoning_effort = "${env:ROPERO_GPTOSS_REASONING:-medium}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "12",
    "--spec-ngram-simple-size-m", "48",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "3",
]

[args.level.high]
reasoning_effort = "${env:ROPERO_GPTOSS_REASONING:-high}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "8",
    "--spec-ngram-simple-size-m", "32",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "4",
]
