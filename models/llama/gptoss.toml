# =============================================================================
# gptoss — gpt-oss-20b (MXFP4) con razonamiento por nivel
# =============================================================================

[model]
name    = "gptoss"
engine  = "llama-server"
context = 131072

[files]
gguf = "openai_gpt-oss-20b-MXFP4.gguf"

[download]
repo = "bartowski/openai_gpt-oss-20b-GGUF-MXFP4-Experimental"
file = "openai_gpt-oss-20b-MXFP4.gguf"
size = "12.11 GB"

[levels]
list    = ["low", "medium", "high"]
default = "medium"

[aliases]
verifier = "high"
designer = "medium"

[args]
base = [
    "--n-gpu-layers", "25",
    "--temp", "1.0",
    "--min-p", "0.0",
    "--top-p", "1.0",
    "--top-k", "${env:ROPERO_GPTOSS_TOPK:-40}",
    "--threads", "12",
    "--threads-batch", "24",
    "--reasoning-format", "auto",
    "--batch-size", "512",
    "--ubatch-size", "256",
    "--n-predict", "16384",
    "--slot-prompt-similarity", "0.2",
    "--keep", "8192",
    "--cache-prompt",
    "--context-shift",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--jinja",
    "--kv-offload",
    "--load-mode", "auto",
]


[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = true }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
