# =============================================================================
# gptoss — gpt-oss-20b (MXFP4) con razonamiento por nivel
# =============================================================================
#
# El nivel de razonamiento lo fija el nivel elegido (`ropero gptoss --high`)
# y se pasa al template como `--chat-template-kwargs {"reasoning_effort": ...}`.
# ROPERO_GPTOSS_REASONING (low|medium|high) lo sobreescribe: es la forma de
# forzar un nivel sin tocar la línea de órdenes. Sin ese env var, cada nivel
# usa el suyo.
#
# El flag se emite UNA SOLA VEZ, desde [args.level.<nivel>]. Antes estaba
# tambien en [args].base: no rompia nada (llama.cpp se queda con el ultimo
# valor, que es el del nivel) pero el base pisaba la intencion y el
# comentario decia una cosa y el codigo otra.
#
# El KV va en q8_0, no en f16: a 131072 la KV f16 son 3,22 GB y con el modelo
# (11,2 GB) + compute (0,73 GB) no caben en los 15,93 GB de VRAM -> la KV se
# va a la CPU, la atencion se calcula en la CPU y los t/s caen de 120-130 a
# 80-100. Con q8_0 la KV son 1,61 GB y todo cabe.
# =============================================================================

[model]
name    = "gptoss"
engine  = "llama-server"
context = 131072

[files]
gguf = "openai_gpt-oss-20b-MXFP4.gguf"

[download]
repo = "bartowski/openai_gpt-oss-20b-GGUF-MXFP4-Experimental"
file = "openai_gpt-oss-20b-MXFP4.gguf"
size = "11.2 GB"

[levels]
list    = ["low", "medium", "high"]
default = "medium"

[aliases]
verifier = "high"
designer = "medium"

[args]
base = [
    "--n-gpu-layers", "99",
    "--temp", "1.0",
    "--min-p", "0.0",
    "--top-p", "1.0",
    "--top-k", "0",
    "--threads", "12",
    "--threads-batch", "24",
    "--reasoning-format", "auto",
    "--batch-size", "4096",
    "--ubatch-size", "1024",
    "--n-predict", "16384",
    "--slot-prompt-similarity", "0.2",
    "--keep", "8192",
    "--cache-type-k", "${env:ROPERO_GPTOSS_KV:-q8_0}",
    "--cache-type-v", "${env:ROPERO_GPTOSS_KV:-q8_0}",
    "--jinja",
    "--kv-unified",
    "--kv-offload",
    "--load-mode", "auto",
]

[args.level.low]
reasoning_effort = "${env:ROPERO_GPTOSS_REASONING:-low}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "6",
    "--spec-ngram-simple-size-m", "16",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "2",
]

[args.level.medium]
reasoning_effort = "${env:ROPERO_GPTOSS_REASONING:-medium}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "12",
    "--spec-ngram-simple-size-m", "48",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "3",
]

[args.level.high]
reasoning_effort = "${env:ROPERO_GPTOSS_REASONING:-high}"
base = [
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "8",
    "--spec-ngram-simple-size-m", "32",
    "--spec-draft-n-min", "1",
    "--spec-draft-n-max", "4",
]
