# =============================================================================
# agents-tiny — Agents-A1-4B (denso, 32 capas) - el modelo pequeño del mismo grupo
# =============================================================================

[model]
name    = "agenta-tiny"
engine  = "llama-server"
context = 262144

[files]
gguf   = "Agents-A1-4B-Q8_0.gguf"

[download]
repo = "InternScience/Agents-A1-4B-Q8_0-GGUF"
file = "Agents-A1-4B-Q8_0.gguf"
size = "4.48 GB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    "--n-gpu-layers", "32",
    "--cache-type-k", "q8_0",
    "--cache-type-v", "q8_0",
    "--temp", "0.85",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--presence-penalty", "1.1",
    "--repeat-penalty", "1.0",
    "--reasoning-format", "auto",
    "--n-predict", "8192",
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = true }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
