# =============================================================================
# agenta1 — Agents-A1-35B-A3B (MoE híbrido 256 expertos, 8 activos)
# =============================================================================
[model]
name    = "agenta1"
engine  = "llama-server"
context = 262144

[files]
gguf   = "Agents-A1-IQ2_M.gguf"

[download]
repo = "KikoCis/Agents-A1-IQ2_M-GGUF"
file = "Agents-A1-IQ2_M.gguf"
size = "11.66 GB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    # ---- GPU offload: que el fitter reparta ----
    "--n-gpu-layers", "41",

    # ---- Attention ----
    "-fa", "on",                            # obligatorio: el KV q4_0 lo exige

    # ---- KV cache ----
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--kv-unified",

    # ---- Sampling (el del propio Agents-A1) ----
    "--temp", "0.55",
    "--top-p", "0.90",
    "--top-k", "15",
    "--min-p", "0.15",
    "--repeat-penalty", "1.08",
    "--dry-multiplier", "0.8",
    "--dry-base", "1.75",
    "--dry-allowed-length", "5",
    "--dry-penalty-last-n", "1024",
    "--dry-sequence-breaker", '["\n", ":", " ", "\t", "\"", ","]',
    "--samplers", "min_p;top_k;top_p;temp;dry",
    "--reasoning-budget", "4096",

    # ---- Batch ----
    "--batch-size", "512",
    "--ubatch-size", "256",
    "--n-predict", "8192",
    # ---- Modelo / carga ----
    "--jinja",
    "--load-mode", "auto",                   # mmap + page cache, no "none"
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = true }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
