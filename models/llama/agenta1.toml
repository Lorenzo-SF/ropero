# =============================================================================
# agenta1 — Agents-A1-35B-A3B (MoE híbrido 256 expertos, 8 activos)
# =============================================================================
[model]
name    = "agenta1"
engine  = "llama-server"
context = 262144

[files]
gguf   = "Agents-A1-Q4_K_M.gguf"

[download]
repo = "InternScience/Agents-A1-Q4_K_M-GGUF"
file = "Agents-A1-Q4_K_M.gguf"
size = "11.66 GB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    "--n-gpu-layers", "41",
    "--n-cpu-moe", "14",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--temp", "0.55",
    "--top-p", "0.90",
    "--top-k", "15",
    "--min-p", "0.15",
    "--repeat-penalty", "1.08",
    "--dry-multiplier", "0.8",
    "--dry-base", "1.75",
    "--dry-allowed-length", "5",
    "--dry-penalty-last-n", "1024",
    "--dry-sequence-breaker", '["\n", ":", " ", "\t", "\"", ","]',
    "--samplers", "min_p;top_k;top_p;temp;dry",
    "--reasoning-budget", "4096",
    "--n-predict", "8192",
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = true }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
