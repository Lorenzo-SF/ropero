# =============================================================================
# agenta1 — Agents-A1-35B-A3B (MoE híbrido 256 expertos, 8 activos)
# =============================================================================
#
#   - GGUF   : Agents-A1-MTP-APEX-I-Mini.gguf  (13.36 GiB)
#   - repo   : SC117/Agents-A1-MTP-APEX-GGUF
#
# ── POR QUÉ ESTE GGUF ───────────────────────────────────────────────────────
# El GGUF que había (jashepp MXFP4_MOE_Q8_0_F16, 19,32 GiB) NO cabe
# en 16 GB de VRAM: el modelo entero se iba a la GPU a pelo y reventaba, o el
# offload de los expertos mataba el decode (el PCIe por token).
# El APEX-I de SC117 entra entero (13,36 GiB) y además trae la cabeza MTP
# DENTRO (el nombre del repo lo dice), así que hay speculation sin ficheros
# extra.
# bartowski no tiene este modelo y unsloth tampoco.
#
# ── ARITMÉTICA DE VRAM (15,32 GiB libres medidos: 15.684 MiB de 15.933) ──────
#   pesos 13,36 GiB
#   KV q4_0 @65536   0,34 GB   (10 capas full-attn x 2 KV x 256 dim x 2 x 0,5 B)
#   compute          ~1,1 GB   (ubatch 256)
#   contexto CUDA    ~0,4 GB
#   --------------------------
#   total           ~15,2 GB   -> cabe, con 0,1 GB de margen (justo: el fitter ajusta)
#
# ── ARGUMENTOS QUE IMPORTAN Y POR QUÉ ──────────────────────────────────────
#   · --n-gpu-layers -1: deja que el fitter reparta. Con un número fijo
#     (99) el fitter aborta con "n_gpu_layers already set by user", el modelo
#     se va entero a la GPU a pelo y revienta con cudaMalloc failed.
#   · --load-mode auto: mmap + page cache. Con "none" el fichero entero se
#     copia a la RAM (y aquí no cabe): se pierde el page cache y el SSD deja
#     de servir de "RAM".
#   · KV q4_0: con f16 no cabe y la KV se va a la CPU -> la atención se
#     calcula en la CPU y los t/s se desploman (es lo que le pasó al gpt-oss
#     con 80-100 t/s en vez de 120-130). El KV cuantizado exige -fa on.
#   · Los niveles son los que acepta el chat_template del modelo (ver abajo).
#
# ── REASONING ───────────────────────────────────────────────────────────────
# El chat_template de este modelo NO tiene niveles de esfuerzo: sólo el flag
# enable_thinking (true/false). Así que "medium" y "high" hacen lo mismo; se
# mantienen los tres nombres para no romper los scripts que ya los usan.
#
# El override del contexto es el canónico ROPERO_AGENTA1_CTX.
# =============================================================================

[model]
name    = "agenta1"
engine  = "llama-server"
context = 65536

[files]
gguf   = "Agents-A1-MTP-APEX-I-Mini.gguf"

[download]
repo = "SC117/Agents-A1-MTP-APEX-GGUF"
file = "Agents-A1-MTP-APEX-I-Mini.gguf"
size = "13.36 GiB"

[levels]
list    = ["low", "medium", "high"]
default = "low"

[args]
base = [
    # ---- GPU offload: que el fitter reparta ----
    "--n-gpu-layers", "-1",

    # ---- Attention ----
    "-fa", "on",                            # obligatorio: el KV q4_0 lo exige

    # ---- KV cache ----
    "--cache-type-k", "q4_0",
    "--cache-type-v", "q4_0",
    "--kv-unified",

    # ---- Sampling (el del propio Agents-A1) ----
    "--temp", "0.55",
    "--top-p", "0.90",
    "--top-k", "15",
    "--min-p", "0.15",
    "--repeat-penalty", "1.08",
    "--dry-multiplier", "0.8",
    "--dry-base", "1.75",
    "--dry-allowed-length", "5",
    "--dry-penalty-last-n", "1024",
    "--dry-sequence-breaker", '["\n", ":", " ", "\t", "\"", ","]',
    "--samplers", "min_p;top_k;top_p;temp;dry",
    "--reasoning-budget", "4096",

    # ---- Speculative decoding con la cabeza MTP (va dentro) ----
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "10",

    # ---- Batch ----
    "--batch-size", "512",
    "--ubatch-size", "256",
    "--n-predict", "8192",
    "--parallel", "1",

    # ---- Modelo / carga ----
    "--jinja",
    "--load-mode", "auto",                   # mmap + page cache, no "none"
]

[args.level.low]
chat_template_kwargs = { enable_thinking = false }

[args.level.medium]
chat_template_kwargs = { enable_thinking = true }

[args.level.high]
chat_template_kwargs = { enable_thinking = true }
