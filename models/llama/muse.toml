# =============================================================================
# ♻️ REACTIVADO — muse (Muse-Glimmer-30B)
# =============================================================================
#
# Reactivado el 2026-10-25 para volver a medirlo en el bench: los
# cinco modelos que estaban bencheados eran casi todos de la misma
# familia (gpt-oss y derivados). Faltaba un coder de verdad y dos MoE
# nuevos que no fueran de esa familia.
#
# Descargable con: ropero download muse
#
# Muse-Glimmer-30B — Config calibrada (RTX 5080 16GB VRAM, 30GB RAM)
#   - DENSE 30B (29.6B con vision encoder 1.8B)
#   - Hybrid: 16 layers local attention (sliding window 2048) + 1 global
#   - Vocab 202,048 (200k BPE + 2048 special)
#   - RoPE θ=500,000
#   - Sampling canónico (repo Meta): temp=1.0, top_p=0.95, top_k=64
#   - Reasoning strength: low/medium/high/xhigh (system prompt)
#   - Speculative decoding: DFlash drafter (16-token blocks)
#
# Peculiaridades críticas:
#   1. DENSE 30B con Q4_K_XL (15.9GB) — NO cabe entero en 16GB VRAM
#      → usar --n-gpu-layers bajo (20-25) y dejar el resto en CPU
#   2. SWA pattern [L,L,L,G] repetido → DEBE llevar --swa-full
#      (sin esto, attention computation usa ventana completa ineficiente)
#   3. --reasoning-format deepseek limpia tags <think> del output
#   4. RoPE θ=500k se infiere del GGUF metadata; --rope-freq-base fuerza valor
#
# El override del contexto es el canónico ROPERO_MUSE_CTX.
# =============================================================================


# ── Politica de VRAM (2026-10-25) ───────────────────────────────────────────
# Este modelo esta en FULL GPU: todas sus capas y su KV cache en la VRAM,
# sin recorte y sin offload a la CPU. Para que eso sea posible:
#
#   · --n-gpu-layers = 52  = el numero REAL de capas del GGUF (leido de
#     <arch>.block_count de la cabecera del propio GGUF, no de un README).
#     OJO: en llama.cpp, un --n-gpu-layers FIJO (distinto de -1) hace que el
#     fitter ABORTE ("n_gpu_layers already set by user to N, abort"). Con -1
#     el fitter reduce el CONTEXTO hasta que el modelo entero cabe. Aqui no
#     hace falta que recorte nada, porque con la cuantizacion de abajo ya
#     cabe: por eso se pone el numero exacto y no -1.
#   · el KV cache va en la GPU (sin --no-kv-offload) y en q4_0, que es lo
#     que hace que el ctx quepa.
#   · SIN MTP: --spec-type draft-mtp crea un draft context con su propia
#     VRAM y su KV en f16, y el fitter lo mide junto al modelo principal.
#     Con el margen justo, el MTP se come la VRAM y el server no arranca.
#   · SIN --n-cpu-moe: mandar expertos a la CPU obliga a cada token a
#     cruzar el bus PCIe en el decode, y el t/s se desploma.
#
# ctx = 131072: el maximo que cabe con el KV en q4_0 y el resto del modelo
# entero en la GPU, con la formula de KV de llama.cpp
# (n_kv*head_dim*(sizeof(k)+sizeof(v))*n_capas_con_atencion*ctx).
#
# Medido en: RTX 5080 Laptop, 15933 MiB de VRAM.
# =============================================================================

[model]
name    = "muse"
engine  = "llama-server"
context = 131072

[files]
gguf   = "Muse-Glimmer-30B-UD-Q3_K_XL.gguf"

[download]
repo = "unsloth/Muse-Glimmer-30B-GGUF"
file = "Muse-Glimmer-30B-UD-Q3_K_XL.gguf"
size = "13.36 GB"

[args]
base = [
    # ---- GPU offload (modelo denso 30B, 16GB VRAM justos) ----
    "--n-gpu-layers", "52",                            # ~22 de 52 layers en GPU; resto CPU

    # ---- Atención ----
    # -fa on lo pone ropero entry globalmente; no duplicar
    "--swa-full",                                      # CRÍTICO: sliding window pattern [L,L,L,G]

    # ---- Positional encoding ----
    "--rope-freq-base", "500000",                      # θ=500k del repo

    # ---- KV cache ----
    "--cache-type-k", "q4_0",                          # agresivo (SWA usa ventanas pequeñas)
    "--cache-type-v", "q4_0",
    "--cache-prompt",
    "--context-shift",
    "--kv-unified",                                    # single user, unified buffer

    # ---- Speculative decoding (DFlash drafter del repo) ----

                        # hasta 16 tokens drfteados por bloque

    # ---- Modelo / carga ----
    "--jinja",                                         # chat template Muse (jinja)
    "--reasoning-format", "deepseek",                  # limpia tags <think> del output
    # Reasoning_strength se pasa en el SYSTEM PROMPT del request,
    # NO como chat-template-kwargs (Muse usa system prompt nativo).
    "--load-mode", "none",                             # mmap off

    # ---- Sampling (canónico Meta Muse) ----
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "64",
    "--min-p", "0.00",
    "--repeat-penalty", "1.0",                         # sin penalty (canónico)
    "--repeat-last-n", "64",

    # ---- Batching / threads ----
    "--batch-size", "4096",
    "--ubatch-size", "1024",
    "--parallel", "1",

    # ---- Generación ----
    "--n-predict", "4096",
    "--keep", "1024",

    # ---- Misc ----
    # --log-verbosity lo pone ropero entry (default 4)
]

[options]
# La temperatura se puede pisar desde el entorno (lo usa el bench para
# medir siempre en el mismo punto: el banco pide 0-0,2 y con temp 1.0 se
# esta midiendo el sampler, no el modelo).
list = ["temp"]

[args.option.temp]
replace = "--temp"
base = ["--temp", "${value}"]
