# =============================================================================
# muse (Muse-Glimmer-30B)
# =============================================================================

[model]
name    = "muse"
engine  = "llama-server"
context = 131072

[files]
gguf = "Muse-Glimmer-30B-UD-IQ4_NL.gguf"

[build]
repo         = "meta-models/Muse-Glimmer-30B"
quant        = "IQ4_NL"
imatrix_repo = "AtomicChat/Muse-Glimmer-30B-GGUF"
imatrix_file = "imatrix/muse-glimmer.imatrix.gguf"
keep_source  = true
# Los pesos que se bajan al fabricar (tamano medido del repo de HF).
size = "59.6 GB"

[args]
base = [
    "--n-gpu-layers", "53",                            # ~22 de 52 layers en GPU; resto CPU
    "--swa-full",                                      # CRÍTICO: sliding window pattern [L,L,L,G]
    "--rope-freq-base", "500000",                      # θ=500k del repo
    "--cache-type-k", "turbo3",                          # agresivo (SWA usa ventanas pequeñas)
    "--cache-type-v", "turbo3",
    "--reasoning-format", "deepseek",                  # limpia tags <think> del output
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "64",
    "--min-p", "0.00",
    "--repeat-penalty", "1.0",                         # sin penalty (canónico)
    "--repeat-last-n", "64",
    "--n-predict", "4096",
    "--keep", "1024",
]
