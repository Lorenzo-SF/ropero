# =============================================================================
# qwen — Qwen3.8-27B (base, denso 27B + VLM) con GGUF de bartowski
# =============================================================================
#
# Por qué bartowski y no cuantizarlo tú:
#   · Sus GGUF usan imatrix (activation-aware): meten más bits donde el modelo
#     los necesita. Un llama-quantize sin imatrix te da peor calidad a igual
#     tamaño.
#   · Te ahorras 41,6 GB de safetensors + 41,6 GB de GGUF F16 + horas de
#     quantize en un portátil.
#   · El GGUF oficial de NVFP4 de Unsloth (21,02 GiB) NO es una opción aquí:
#     sólo cuantiza el MLP; la atención se queda en FP8 (10,29 GB) y el
#     embed (248320 x 5120) en BF16 (2,54 GB). No cabe en 16 GB de VRAM.
#
# ── TAMAÑOS REALES (bartowski/Qwen3.8-27B-GGUF, medidos) ────────────────────
#   IQ4_XS 15,48 GB (NO cabe) | IQ3_M 14,86 (NO cabe) | Q3_K_M 13,40
#   IQ3_XS 12,80 GB  <-- el que usa este fichero
#   IQ3_XXS 12,32 | Q3_K_S 12,73 | IQ2_M 10,52 | Q4_0 16,35
#
# ── POR QUÉ IQ3_XS ──────────────────────────────────────────────────────────
#   VRAM 15,93 GB totales -> ~15,5 utilizables (el contexto CUDA se come ~0,4)
#     IQ3_XS          12,80 GB
#     KV q4_0 @65536    1,05 GB   (16 capas full-attn x 4 KV x 256 dim x 2 x 0,5 B)
#     KV q4_0 @131072   2,09 GB   (el contexto completo NO cabe)
#     compute buffer    ~0,9 GB   (ubatch 256: los logits = 248320 x 256 x 4B)
#     --------------------------
#     total            ~14,8 GB   -> 131072 cabe
#
#   OJO: el ctx NATIVO del Qwen3.8-27B son 262144 (max_position_embeddings
#   del config.json), no 131072. A 262144 la KV q4_0 serían 2,15 GB -> 15,9 GB
#   -> no cabe; por eso el contexto de este fichero es 131072 (la mitad).
#   Para el ctx nativo entero, usa `qwen38-apex` (NanoPlus de IsValorum,
#   11,35 GiB), que sí lo aguanta con el mismo q4_0.
#
#   Con KV f16 la KV serían 4,29 GB -> 16,6 GB -> no cabe -> la KV se va a la
#   CPU, la atención se calcula en la CPU y los t/s se desploman. De ahí el
#   q4_0 (el KV cuantizado exige -fa on, que va aquí).
#
#   La cabeza MTP (los tensores nextn) SI esta dentro del GGUF y SI se usa
#   (--spec-type draft-mtp). Medido en este modelo: 66/66 capas en la GPU,
#   aceptacion del draft 19-37 %, y el server arranca sin problemas. El
#   MTP NO es lo que hizo lento al qwen: el bench lo mato a los 900 s
#   generando a 27 t/s, no colgado.
#
#   OJO con el otro caso: en agenta1 el MTP SI impedia arrancar (el server
#   se quedaba sin memoria). La diferencia es el margen de VRAM: el MTP
#   crea un draft context con su propio espacio y su KV en f16, y en un
#   modelo que ya llena la GPU no cabe. Aqui el qwen (12,8 GB de pesos +
#   KV q4_0) deja sitio. Si cambias de GGUF, comprueba el margen antes.

[model]
name    = "qwen"
engine  = "llama-server"
context = 65536

[files]
gguf   = "Qwen3.8-27B-IQ3_XS.gguf"
# Sin mmproj: el visor de imagen son 693 MiB de VRAM (12.207 - 11.514). Con el
# escritorio abierto solo quedaban 14.036 MiB libres y el fitter recortaba 16
# capas a la CPU -> 9 t/s en vez de ~30. Si lo quieres de vuelta, descomenta
# la linea y baja el contexto.
# mmproj = "mmproj-Qwen3.8-27B-f16.gguf"

[download]
repo = "bartowski/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-IQ3_XS.gguf"
size = "12.80 GB"

[levels]
list    = ["low", "medium", "xhigh"]
default = "low"

[flags]
list = []

[args]
base = [
    # ---- GPU offload ----
    # -1 = auto: el fitter reparte solo. NO pongas un numero: con
    # --n-gpu-layers fijo el fitter aborta ("n_gpu_layers already set by
    # user") y el modelo se va entero a la GPU a pelo -> cudaMalloc failed.
    # Es exactamente lo que tumbó al codoss en el bench: con "-ngl 25" fijo
    # pidio 12.036 MiB de golpe, no los habia, y el server no arranco.
    "--n-gpu-layers", "-1",

    # ---- Attention ----
    "-fa", "on",                            # obligatorio: el KV q4_0 lo exige

    # ---- KV cache ----
    "--cache-type-k", "q4_0",                # 1,07 GB a 131072 (f16 = 4,29 GB)
    "--cache-type-v", "q4_0",
    "--kv-unified",

    # ---- Sampling oficial en modo thinking (ficha de Qwen3.8) ----
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",

    # ---- Batch ----
    "--batch-size", "512",
    "--ubatch-size", "256",                 # compute buffer ~0,9 GB

    # ---- Speculative decoding con la cabeza MTP (va dentro del GGUF) ----
    # Medido: draft acceptance 19-37 %, y el server arranca (66/66 capas).
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "10",

    "--n-predict", "16384",

    # ---- Reasoning ----
    "--reasoning-budget", "12288",    

    # ---- Modelo / carga ----
    "--jinja",
    "--load-mode", "auto",
]

# El nivel marca el reasoning_effort. El env ROPERO_QWEN_REASONING lo
# sobreescribe (es la forma de forzar un nivel sin tocar la línea de órdenes).
[args.level.low]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-low}"

[args.level.medium]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-medium}"

[args.level.xhigh]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-xhigh}"

# Sin --vision el servidor arranca sin torre de visión (menos VRAM) y sólo
# lee texto. Con --vision hay que tener el mmproj en disco.
# El flag "vision" (mmproj) se ha ido: el visor de imagen son 693 MiB de VRAM
# y aqui no hace falta. Para reincorporarlo:
#   [files]      mmproj = "mmproj-Qwen3.8-27B-f16.gguf"
#   [flags]      list = ["vision"]
#   [args.flag.vision]
#   base    = ["--mmproj", "${mmproj}"]
#   requires = ["mmproj"]
