# =============================================================================
# qwen — Qwen3.8-27B (base, denso 27B + VLM) con GGUF de bartowski
# =============================================================================

[model]
name    = "qwen"
engine  = "llama-server"
context = 163840

[files]
gguf   = "Qwen3.8-27B-IQ2_M.gguf"

[download]
repo = "bartowski/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-IQ2_M.gguf"
size = "10.52 GB"

[levels]
list    = ["low", "medium", "high", "xhigh"]
default = "low"

[flags]
list = ["mtp"]

[args]
base = [
    "--n-gpu-layers", "66",

    "--cache-type-k", "turbo3",              # el kernel de FA no tiene q4_0+turbo3
    "--cache-type-v", "turbo3",              # (fattn.cu:2935 -> GGML_ABORT)

    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",

    "--batch-size", "512",
    "--ubatch-size", "256",         

    "--n-predict", "16384",

    "--reasoning-preserve",
    "--reasoning-budget", "12288",    
    "--checkpoint-min-step","256",

    "--load-mode", "mlock",
]

[args.level.low]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-low}"

[args.level.medium]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-medium}"

[args.level.high]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-xhigh}"

[args.level.xhigh]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-xhigh}"

[args.flag.mtp]
base = [
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "2",
    "--spec-draft-type-k", "turbo3",
    "--spec-draft-type-v", "turbo3",
    "--no-spec-draft-backend-sampling",
]

