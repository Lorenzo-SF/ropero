# =============================================================================
# qwen — Qwen3.8-27B (base, denso 27B + VLM) con GGUF de bartowski
# =============================================================================

[model]
name    = "qwen"
engine  = "llama-server"
context = 196608

[files]
gguf   = "Qwen3.8-27B-UD-IQ3_S.gguf"

[download]
repo = "bartowski/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-UD-IQ3_S.gguf"
size = "11.20 GB"

[levels]
list    = ["low", "medium", "high", "xhigh"]
default = "low"

[flags]
list = ["mtp"]

[args]
base = [
    "--n-gpu-layers", "66",
    "--cache-type-k", "q4_0",              # el kernel de FA no tiene q4_0+q4_0
    "--cache-type-v", "q4_0",              # (fattn.cu:2935 -> GGML_ABORT)
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--n-predict", "16384",
    "--reasoning-preserve",
    "--reasoning-budget", "12288",    
    "--checkpoint-min-step","256",
]

[args.level.low]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-low}"

[args.level.medium]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-medium}"

[args.level.high]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-xhigh}"

[args.level.xhigh]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-xhigh}"

[args.flag.mtp]
base = [
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "2",
    "--spec-draft-type-k", "q4_0",
    "--spec-draft-type-v", "q4_0",
    "--no-spec-draft-backend-sampling",
]

