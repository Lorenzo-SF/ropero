# =============================================================================
# qwen — Qwen3.8-27B (base, denso 27B + VLM) con GGUF de bartowski
# =============================================================================

[model]
name    = "qwen"
engine  = "llama-server"
# ctx NATIVO del GGUF (262144). Cabe con turbo3: el IQ2_M real son 10.52 GB
# (no 12.80: ese size era del IQ3_XS), y a 262144 el KV turbo3 son 3.5-4 GB.
# Margen estimado: 350-870 MiB de los 15.300 MiB libres.
context = 262144

[files]
gguf   = "Qwen3.8-27B-IQ2_M.gguf"

[download]
repo = "bartowski/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-IQ2_M.gguf"
size = "10.52 GB"

[levels]
# "high" es un ALIAS de "xhigh": el chat template del qwen35 solo acepta
# low / medium / xhigh (y su default es xhigh), asi que "high" se declara
# aqui para que el nivel sea visible y valido, no un bloque huerfano.
list    = ["low", "medium", "high", "xhigh"]
default = "low"

[flags]
list = []

[args]
base = [
    "--n-gpu-layers", "66",

    "--cache-type-k", "turbo3",              
    "--cache-type-v", "turbo3",

    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",

    "--batch-size", "512",
    "--ubatch-size", "256",         

    "--n-predict", "16384",

    "--reasoning-preserve",
    "--reasoning-budget", "12288",    
    "--checkpoint-min-step","256",

    "--load-mode", "mlock",
]

[args.level.low]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-low}"

[args.level.medium]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-medium}"

[args.level.high]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-xhigh}"

[args.level.xhigh]
reasoning_effort = "${env:ROPERO_QWEN_REASONING:-xhigh}"

