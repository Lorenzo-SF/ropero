# =============================================================================
# qwen — Qwen3.8-27B (base, denso 27B + VLM) con GGUF de bartowski
# =============================================================================

[model]
name    = "qwen38"
engine  = "llama-server"
context = 133072

[files]
gguf = "Qwen3.8-27B-UD-IQ3_XXS.gguf"

# [download]
# repo = "unsloth/Qwen3.8-27B-GGUF"
# file = "Qwen3.8-27B-UD-IQ3_XXS.gguf" #"Qwen3.8-27B-UD-IQ3_XXS.gguf" # con mtp, IQ3_XXS, sin mtp, entra el 
# size = "4.48 GB"

# [build]
# repo         = "nvidia/Qwen3.8-27B-NVFP4"
# quant        = "NVFP4"
# imatrix_repo = "unsloth/Qwen3.8-27B-GGUF"
# imatrix_file = "imatrix_unsloth.gguf"
# keep_source  = true
# size = "55.6 GB"

[levels]
list    = ["low", "medium", "high", "xhigh"]
default = "xhigh"

[args]
base = [
    "--n-gpu-layers", "66",
    "--cache-type-k", "q4_0",
    "--cache-type-v", "q4_0",
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--n-predict", "16384",
    "--reasoning-preserve",
    "--reasoning-budget", "12288",
    "--checkpoint-min-step","256",
    "--spec-default",
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "2",
    "--spec-draft-type-k", "turbo3",
    "--spec-draft-type-v", "turbo3",
    "--no-spec-draft-backend-sampling",
]

[args.level.low]
reasoning_effort = "low"

[args.level.medium]
reasoning_effort = "medium"

[args.level.high]
reasoning_effort = "xhigh"

[args.level.xhigh]
reasoning_effort = "xhigh"

