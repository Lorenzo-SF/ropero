# qwen — Qwen3.8-27B (base, denso 27B + VLM) con GGUF de bartowski
# Configurado para RTX 5080 16GB VRAM + 32GB sistema RAM (Cachy OS)

[model]
name    = "qwen38"
engine  = "llama-server"
context = 131072

[files]
gguf = "Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf"

[download]
repo = "ISTA-DASLab/Qwen3.8-27B-GGUF" #"unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf"
size = "4.48 GB"

[build]
repo         = "nvidia/Qwen3.8-27B-NVFP4"
quant        = "NVFP4"
imatrix_repo = "unsloth/Qwen3.8-27B-GGUF"
imatrix_file = "imatrix_unsloth.gguf"
keep_source  = true
size = "55.6 GB"

[levels]
list    = ["low", "medium", "high", "xhigh"]
default = "low"

[args]
base = [
    "--n-gpu-layers", "66",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.0",
    "--repeat-penalty", "1.0",
    "--n-predict", "16384",
    "--reasoning-preserve",
    "--reasoning-budget", "8192",
    "--checkpoint-min-step","256",

    "--spec-default",
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max","3",
    "--spec-draft-n-min", "1",
    "--spec-chain","1",
    "--spec-draft-type-k", "turbo3",
    "--spec-draft-type-v", "turbo3",
    "--no-spec-draft-backend-sampling",


]

[args.level.low]
reasoning_effort = "low"

[args.level.medium]
reasoning_effort = "medium"

[args.level.high]
reasoning_effort = "xhigh"

[args.level.xhigh]
reasoning_effort = "xhigh"
