[model]
name    = "qwen38-flm"
engine  = "fastflowlm"
context = 32000
format  = "q4nx"
path    = "Qwen3.8-27B-NPU2"

[files]

[download]
repo = "FastFlowLM/Qwen3.8-27B-NPU2"
