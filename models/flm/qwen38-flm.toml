# =============================================================================
# qwen38-flm — Qwen3.8-27B en la NPU AMD (FastFlowLM)
#
# El mismo modelo que 'qwen38' (Qwen3.8-27B en GGUF, en la GPU), pero el
# build NPU2 de FLM: model.q4nx sobre la NPU (XDNA).
#
# OJO: [model].path NO es una ruta: es el TAG del almacén de FLM.
#
# CONTEXTO: se queda en 4096, el contexto por defecto de FLM para este tag.
# No es capricho: FLM avisa de que Qwen3.8 con prompts largos devuelve basura
# (un passkey salió bien a 6k y 14k tokens y se corrompió a 10k y 28k, con
# resultados distintos entre ejecuciones). El máximo del modelo en FLM son
# 8k tokens. Si subes el contexto, el modelo puede contestarte "! ! !".
#
# MEMORIA (medida por FLM, no estimada):
#   · pesos ............ ~17,6 GB
#   · contexto ......... 84 KiB por token (672 MiB por cada 8k) + 151 MiB fijos
#   · total a 4k ....... ~18,1 GB   · a 8k ... ~18,4 GB
#
# NECESITA EL BIOS: con el tope por defecto de la NPU (~15,6 GB) no cabe ni
# en el contexto mínimo. Con la UMA frame buffer del iGPU fijada a 2 GB la
# NPU llega a ~21 GB y sí cabe (ver docs/flm-memoria.md).
# =============================================================================

[model]
name    = "qwen38-flm"
engine  = "fastflowlm"
context = 4096
format  = "safetensors"
path    = "qwen3.8-mtp:27b"

[files]

[download]
repo = "FastFlowLM/Qwen3.8-27B-NPU2"
size = "~27 GB"

[limits]
min_ram_gb = 19

[args]
base = [
    "--prefix-cache-mb", "4096",
    "--prefix-slots", "8",
]
