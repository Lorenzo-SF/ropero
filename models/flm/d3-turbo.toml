[model]
name    = "d3turbo"
engine  = "fastflowlm"
context = 131072
format  = "q4nx"
path    = "d3:turbo"

[files]

[download]
repo = "FastFlowLM/D3-Turbo-NPU2"
size = "~1 GB"

[limits]
min_ram_gb = 2

[args]
base = [
  "--prefill-chunk-len", "8192",
  "--prefix-cache-mb", "2048",
  "--prefix-slots", "4",
  "--prefix-min-gain", "256",
]
