# =============================================================================
# d3nano — el motor de decisión (D3) de FastFlowLM en la NPU
#
# D3 NO genera texto: es un clasificador con opciones tipadas y una
# probabilidad para cada una. Para eso está el routing: elegir el agente y
# el alias. Lo decide mejor y más barato un modelo entrenado para eso que un
# LLM de 20B.
#
# POR QUÉ NANO Y NO TURBO (medido por FLM, no estimado):
#
#   tag      pesos   pico @32k   1k tok   4k tok   32k tok
#   d3:edge  0,6 GB  4,8 GB      0,26 s   1,0 s     17 s
#   d3:lite  0,8 GB  —           0,4 s    1,6 s     23 s
#   d3:nano  2,0 GB  5,3 GB      0,6 s    2,5 s     28 s
#   d3:mini  3,4 GB  8,6 GB      1,3 s    5,3 s     66 s
#   d3:flash 6,1 GB  14 GB       2,3 s    9,0 s     96 s
#   d3:turbo 16,6 GB 26,3 GB     3,0 s    27 s      5 min  ← 28 GB de RAM libre
#
# El turbo pide 28 GB de RAM libre para planearlo: con 32,7 GB de RAM en
# total y el modelo de la GPU cargado, no entra. El nano pico 5,3 GB y
# contesta en 0,6 s con un prompt de 1k tokens: el routing es instantáneo.
#
# OJO: la NPU sirve UNA petición a la vez. Mientras el D3 decide, el chat de
# la NPU (lfm3) espera. El flujo normal no lo nota: Mavis decide y delega en
# un especialista de la GPU.
#
# OJO: [model].path NO es una ruta: es el TAG del almacén de FLM.
# =============================================================================

[model]
name    = "d3nano"
engine  = "fastflowlm"
# El máximo de entrada del D3 son 32768 tokens (suficiente y de sobra para
# una petición de routing); su default_context_length también.
context = 32768
format  = "q4nx"
path    = "d3:nano"

[files]

[download]
repo = "FastFlowLM/D3-Nano-NPU2"
size = "~2 GB"

[limits]
min_ram_gb = 6

[args]
base = [
  "--prefill-chunk-len", "8192",
  "--prefix-cache-mb", "2048",
  "--prefix-slots", "4",
  "--prefix-min-gain", "256",
]
