# =============================================================================
# d3mini — el motor de decisión (D3) de FastFlowLM en la NPU
#
# D3 NO genera texto: es un clasificador con opciones tipadas y una
# probabilidad para cada una. Para eso está el routing: elegir el agente y
# el alias. Lo decide mejor y más barato un modelo entrenado para eso que un
# LLM de 20B.
#
# POR QUÉ MINI (medido por FLM, no estimado):
#
#   tag      pesos   pico @32k   1k tok   4k tok   32k tok
#   d3:edge  1,5 GB  4,8 GB      0,26 s   1,0 s    17 s
#   d3:lite  0,8 GB  —           0,4 s    1,6 s    23 s
#   d3:nano  2,0 GB  5,3 GB      0,6 s    2,5 s    28 s
#   d3:mini  3,5 GB  8,6 GB      1,3 s    5,3 s    66 s
#   d3:flash 14,5 GB 14 GB       2,3 s    9,0 s    96 s
#   d3:turbo 28,0 GB 26,3 GB     3,0 s    27 s     5 min  ← 28 GB de RAM libre
#
# El turbo pide 28 GB de RAM libre para planearlo: con 32,7 GB de RAM en
# total y el modelo de la GPU cargado, no entra. El mini pico 8,6 GB y
# contesta en 1,3 s con un prompt de 1k tokens.
#
# POR QUÉ path = "" (vacío a propósito)
#
# El D3 no se sirve como modelo de chat: se sirve como DECISIÓN. El tag va
# en `--decision d3:mini` (ver [args].base), que es lo que hace que el
# servidor exponga /v1/systemone. Con `flm serve <tag>` se arrancaría un
# chat que además competiría por la NPU con la decisión. Por eso el tag NO
# está en [model].path: el hook de install lo saca de los args.
#
# OJO: la NPU sirve UNA petición a la vez. Mientras el D3 decide, el chat de
# la NPU (lfm3) espera. El flujo normal no lo nota: Mavis decide y delega en
# un especialista de la GPU.
#
# OJO: [model].path NO es una ruta: es el TAG del almacén de FLM.
# =============================================================================

[model]
name    = "d3mini"
engine  = "fastflowllm"
# El máximo de entrada del D3 son 32768 tokens (su default_context_length
# en el catálogo de FLM, src/model_list.json, para TODOS los d3:*). Suficiente
# y de sobra para una petición de routing.
context = 32768
format  = "q4nx"
path    = ""

[files]

[download]
repo = "FastFlowLM/D3-Mini-NPU2"
size = "~3.5 GB"

[limits]
min_ram_gb = 4

[args]
base = [
  "--decision", "d3:mini",
  "--prefill-chunk-len", "8192",
  "--prefix-cache-mb", "2048",
  "--prefix-slots", "4",
  "--prefix-min-gain", "256",
]
