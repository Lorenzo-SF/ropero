# =============================================================================
# deepseek-r1-flm — DeepSeek-R1-Distill-Llama-8B en la NPU AMD (FastFlowLM)
#
# El mismo modelo que 'deepseek-r1' de FLM, sin Thinking: es el distill de
# Llama-3.1-8B con el razonamiento de R1 dentro. OJO: [model].path NO es una
# ruta, es el TAG del almacén de FLM.
#
# MEMORIA (medida por FLM, no estimada):
#   · pesos ............ ~3,4 GB
#   · contexto ......... 128 KiB por token (es el que más KV gasta de los
#                        seis: 1 GB por cada 8k de tokens)
#   · total a 8k ....... ~4,4 GB    · a 16k ... ~5,4 GB    · a 32k ... ~7,4 GB
#   · contexto máximo de FLM: 128k (a 128k la KV sola serían 16 GB)
#
# Es de los que CABEN de sobra en el tope de ~15,6 GB de la NPU.
# =============================================================================

[model]
name    = "deepseek-r1-flm"
engine  = "fastflowlm"
context = 16384
format  = "safetensors"
path    = "deepseek-r1:8b"

[files]

[download]
repo = "FastFlowLM/Deepseek-R1-Distill-Llama-8B-NPU2"
size = "~8 GB"

[limits]
min_ram_gb = 8

[args]
# Flags del servidor de FLM (los de `flm serve`). Los de prefijo están a
# su valor por defecto: se ponen explícitos para que se vea de qué va el
# modelo sin tener que mirar la documentación de FLM.
base = [
    "--prefix-cache-mb", "4096",
    "--prefix-slots", "8",
]
