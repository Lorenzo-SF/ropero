# bonsai — Ternary Bonsai 2 27B (GGUF PrismML) con MTP
# Configurado para RTX 5080 16GB VRAM + 32GB RAM (Cachy OS)

[model]
name    = "bonsai"
engine  = "turbo-llama"
context = 262144
format  = "gguf"

[files]
gguf = "Ternary-Bonsai-2-27B-Q2_0.gguf"
chat_template = "chat_template.jinja"

[download]
repo = "prism-ml/Ternary-Bonsai-2-27B-gguf"
file = "Ternary-Bonsai-2-27B-Q2_0.gguf"
size = "~8.5 GB (estimado)"

[download.aux.chat_template]
repo = "prism-ml/Ternary-Bonsai-2-27B-mlx-2bit"
file = "chat_template.jinja"
name = "chat_template.jinja"
size = "8.95 KB"
use  = "run"

[levels]
list    = ["instruct",  "instruct"]
default = "instruct"

[args]
base = [
    # --- GPU y Contexto (Ajustado a 16GB VRAM) ---
    "--n-gpu-layers", "66",
    "--chat-template-file", "${chat_template}",

    # --- Caché KV cuantizada para ahorrar VRAM ---
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",

    # --- Generación ---
    "--n-predict", "16384", 
	"--reasoning-preserve",
	
    # opcion 1
    "--spec-type", "ngram-simple",
    "--spec-ngram-simple-size-n", "12",
    "--spec-ngram-simple-size-m", "32",
    "--spec-ngram-simple-min-hits", "1",
    "--spec-draft-n-max", "32",
	"--reasoning-format", "deepseek",

    # opcion 2
   # "--spec-type", "ngram-map-k4v",
   # "--spec-ngram-map-k4v-size-n", "8",
   # "--spec-ngram-map-k4v-size-m", "16",
   # "--spec-ngram-map-k4v-min-hits", "2",
   # "--spec-draft-n-max", "32",
    
    # opcion 3
   # "--spec-type", "ngram-mod",
   # "--spec-ngram-mod-n-match", "24",
   # "--spec-ngram-mod-n-min", "16",
   # "--spec-ngram-mod-n-max", "32",
   # "--spec-draft-n-max", "32",

]


[args.level.instruct]
# Modo instruct: respuestas directas, sin razonamiento.
chat_template_kwargs = { reasoning_effort = "medium", preserve_thinking = true }

base = [
    "--temp", "0.7",
    "--top-p", "0.80",
    "--top-k", "20",
    "--min-p", "0.0",
    "--presence-penalty", "1.5",
    "--repeat-penalty", "1.0",
    "--reasoning", "off",
    "--reasoning-budget", "0",
]

[args.level.thinking]
# Modo thinking: razonamiento completo (xhigh).
chat_template_kwargs = { reasoning_effort = "xhigh", preserve_thinking = true }

base = [
    "--temp", "1.0",
    "--top-p", "0.95",
    "--top-k", "20",
    "--min-p", "0.05",
    "--presence-penalty", "0.0",
    "--repeat-penalty", "1.0",
    "--reasoning-preserve",
    "--reasoning", "on",
]
