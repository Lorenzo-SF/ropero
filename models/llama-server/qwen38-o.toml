# qwen — Qwen3.8-27B (base, denso 27B + VLM) con GGUF de bartowski
# Configurado para RTX 5080 16GB VRAM + 32GB sistema RAM (Cachy OS)

[model]
name    = "qwen38-o"
engine  = "llama-server"
context = 65536
format = "gguf"

[files]
gguf = "Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf"

[download]
repo = "ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF" 
file = "Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf"
size = "12.1 GB"

[levels]
list    = ["low", "medium", "high", "xhigh"]
default = "low"

[args]
base = [
    "--n-gpu-layers", "66",
    "--cache-type-k", "turbo3",
    "--cache-type-v", "turbo3",

    "--n-predict", "16384",
    "--reasoning-preserve",
    "--checkpoint-min-step", "8192",

    "--spec-type", "nextn",
    "--spec-draft-n-max", "4" ,
    "--spec-draft-n-min", "1"

    # "--spec-type", "nextn", 
    # "--spec-draft-n-min", "1",     
    # "--spec-draft-p-min", "0.6",     
    # "--spec-draft-type-k", "turbo3",  
    # "--spec-draft-type-v", "turbo3",  
]

[args.level.low]
reasoning_effort = "low"
chat_template_kwargs = { reasoning_effort = "low" }
base = [
    "--temp", "0.6", 
    "--top-p", "0.95", 
    "--top-k", "20", 
    "--min-p", "0.05", 
    "--presence-penalty", "0.6", 
    "--repeat-penalty", "1.0", 
    "--reasoning-effort", "low", 
    "--reasoning-budget", "2048", 
    # "--spec-draft-n-max", "3", 
]

[args.level.medium]
reasoning_effort = "medium"
chat_template_kwargs = { reasoning_effort = "medium" }
base = [
    "--temp", "1.0", 
    "--top-p", "0.95", 
    "--top-k", "20", 
    "--min-p", "0.0", 
    "--presence-penalty", "0.0", 
    "--repeat-penalty", "1.0", 
    "--reasoning-effort", "medium", 
    "--reasoning-budget", "8192", 
    # "--spec-draft-n-max", "3", 
]

[args.level.high]
reasoning_effort = "xhigh"
chat_template_kwargs = { reasoning_effort = "xhigh" }
base = [
    "--temp", "1.0", 
    "--top-p", "0.95", 
    "--top-k", "20", 
    "--min-p", "0.0", 
    "--repeat-penalty", "1.0", 
    "--reasoning-effort", "xhigh", 
    "--reasoning-budget", "16384", 
    # "--spec-draft-n-max", "4", 
]

[args.level.xhigh]
reasoning_effort = "xhigh"
chat_template_kwargs = { reasoning_effort = "xhigh" }
base = [
    "--temp", "1.0", 
    "--top-p", "0.95", 
    "--top-k", "20", 
    "--min-p", "0.0", 
    "--repeat-penalty", "1.0", 
    "--reasoning-effort", "xhigh", 
    "--reasoning-budget", "16384", 
    # "--spec-draft-n-max", "4", 
]