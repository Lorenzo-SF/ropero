# =============================================================================
# gyro-s — Qwen3.8-Flash-Next (Gyro-S) servido por Strata
#
# [model].path identifica el perfil ya preparado por Strata; "gyro/Gyro-S"
# se convierte al id de perfil "gyro-gyro-s" que devuelve su CLI.
# Ropero sólo sirve perfiles instalados y no descarga ni prepara sus componentes.

[model]
name    = "gyro-s"
engine  = "strata"
context = 65536
format  = "strata"
path    = "gyro/Gyro-S"

[files]

[options]
list = ["parallel", "batch-groups", "max-queue", "queue-timeout"]

[flags]
list = ["batch-telemetry", "offline"]

[args.option.parallel]
base = ["--parallel", "${value}"]

[args.option.batch-groups]
base = ["--batch-groups", "${value}"]

[args.option.max-queue]
base = ["--max-queue", "${value}"]

[args.option.queue-timeout]
base = ["--queue-timeout", "${value}"]

[args.flag.batch-telemetry]
base = ["--batch-telemetry"]

[args.flag.offline]
base = ["--offline"]
