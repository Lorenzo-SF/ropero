# =============================================================================
# strata-gyro-s — Qwen3.8-Flash-Next (Gyro) Gyro-S servido por STRATA
# =============================================================================
# La variante que AHORRA memoria: la cuantización trellis (TQK6/TQK7 en base
# Hadamard) son 27,64 GiB de pesos, pero el archivo pesa 58,5 GB porque lleva
# dentro la tabla n-gram de 28,8 GB. Es el modelo grande CON la tabla: la
# tabla se queda en el SSD y es lo que hunde el modo low-RAM.
#
# Mismo criterio que qwen38-q2: sin min_ram_gb, que lo decida Strata.
#
# [model].path NO es una ruta: es el par familia/paquete del catálogo de
# Strata ("qwen36" + "UD-Q4_K_XL"). Los ficheros los baja y los prepara
# Strata en su carpeta; ropero sólo apunta.
#
# Los pesos NO los baja ropero: los baja Strata al arrancar (no hay modo de
# "descargar sin arrancar"). Ver docs/strata.md.
# =============================================================================

[model]
name    = "strata-gyro-s"
engine  = "strata"
context = 32768
format  = "strata"
path    = "gyro/Gyro-S"

[files]

[options]
list = ["tune", "vision", "mtp", "kv", "parallel", "drafting", "vram-reserve"]

# La base: sólo esta máquina. El TUNING no va aquí porque es opt-in
# ("--tune quick") y pondría un "--tune skip" duplicado.
[args]
base = [
    "--access", "local",
]

[args.option.tune]
base = ["--tune", "${value}"]

[args.option.vision]
base = ["--vision", "${value}"]

[args.option.mtp]
base = ["--mtp", "${value}"]

[args.option.kv]
base = ["--kv", "${value}"]

[args.option.parallel]
base = ["--parallel", "${value}"]

[args.option.drafting]
base = ["--drafting", "${value}"]

# La reserva de VRAM: con menos de 512 MiB libres el driver de NVIDIA pagina
# y la petición no vuelve nunca. 1344 MiB es el valor medido en esta máquina
# (RTX 5080 Laptop). El motor lo llama --vram-reserve-mib.
[args.option.vram-reserve]
base = ["--set", "vram_reserve_mib=${value}"]
