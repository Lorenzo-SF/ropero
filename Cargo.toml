[workspace]
resolver = "2"
members = [
    "crates/ropero-core",
    "crates/ropero-runtime",
    "crates/ropero-download",
    "crates/ropero-forge",
    "crates/ropero-server",
    "crates/ropero-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
