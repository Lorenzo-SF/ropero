[package]
name = "ropero-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

# El golden master (§8.1 del doc B) vive en `tests/golden/`: cargo no
# descubre solo los ficheros de un subdirectorio, así que el target se
# declara a mano.
[[test]]
name = "golden"
path = "tests/golden/argv.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
