[package]
name = "ropero-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# ropero-runtime es la capa de E/S que le pasa al dominio los datos ya
# capturados (aquí, la información de la máquina).
ropero-core = { path = "../ropero-core" }
# ropero-bateria: el dominio puro de la batería (el índice, los puntuadores
# y el informe). El runtime lo usa para puntuar lo que el motor devuelve.
ropero-bateria = { path = "../ropero-bateria" }
signal-hook = "0.4.5"
