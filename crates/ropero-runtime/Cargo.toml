[package]
name = "ropero-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# ropero-runtime es la capa de E/S que le pasa al dominio los datos ya
# capturados (aquí, la información de la máquina).
ropero-core = { path = "../ropero-core" }
# ropero-bateria: el dominio puro de la batería (el índice, los puntuadores
# y el informe). El runtime lo usa para puntuar lo que el motor devuelve.
ropero-bateria = { path = "../ropero-bateria" }
serde_json = "1.0"
toml_edit = "0.25"
toml = "1.2"
signal-hook = "0.4.5"
serde_yaml = "0.9.34"
jsonc-parser = { version = "0.34", features = ["cst", "serde", "serde_json"] }
libc = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
tempfile = "3"
rpassword = "7"
zeroize = "1"
