[package]
name = "ropero-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ropero"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.1"
ropero-core = { path = "../ropero-core" }
# ropero-bateria: el dominio puro de la batería de pruebas (el índice, los
# puntuadores y el informe).
ropero-bateria = { path = "../ropero-bateria" }
# ropero-forge: la forja de GGUFs (F6).
ropero-forge = { path = "../ropero-forge" }
# ropero-download: la descarga real de los modelos con `hf`.
ropero-download = { path = "../ropero-download" }
# ropero-runtime: la capa de E/S que captura los datos de la máquina.
ropero-runtime = { path = "../ropero-runtime" }
