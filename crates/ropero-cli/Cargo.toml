[package]
name = "ropero-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ropero"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ropero-core = { path = "../ropero-core" }
# ropero-runtime: la capa de E/S que captura los datos de la máquina.
ropero-runtime = { path = "../ropero-runtime" }
